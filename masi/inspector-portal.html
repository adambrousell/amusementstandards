<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Inspector Portal &middot; AS 360</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Barlow+Condensed:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1A1E25;--surface:#22272E;--surface2:#2D333B;--border:#373E47;
  --accent:#6CA4DC;--accent-l:rgba(108,164,220,.1);--accent-b:rgba(108,164,220,.25);
  --text:#D0D7DE;--text2:#9BA4AE;--text3:#6E7681;
  --good:#3FB950;--good-bg:rgba(63,185,80,.06);--good-b:rgba(63,185,80,.2);
  --warn:#D29922;--warn-bg:rgba(210,153,34,.06);--warn-b:rgba(210,153,34,.2);
  --red:#F85149;--red-bg:rgba(248,81,73,.06);--red-b:rgba(248,81,73,.2);
  --mono:'IBM Plex Mono',monospace;--sans:'IBM Plex Sans',sans-serif;
  --panel:#22272E;--panel2:#2D333B;--panel3:#343B45;--border2:#444C56;
  --cond:'Barlow Condensed',sans-serif;
  --text-bright:#E6EDF3;--text-dim:#6E7681;--text-muted:#484F58;
  --accent-dim:rgba(108,164,220,.15);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);}
body{font-family:var(--sans);color:var(--text2);display:flex;flex-direction:column;min-height:100vh;}
.hdr{background:var(--surface);border-bottom:1px solid var(--border);padding:0 18px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:100;}
.hdr-brand{display:flex;align-items:center;gap:10px;}
.hdr-logo{font-family:var(--sans);font-size:15px;font-weight:700;color:var(--text);letter-spacing:-.02em;}
.hdr-logo span{color:var(--accent);font-weight:700;}
.hdr-divider{width:1px;height:16px;background:var(--border);}
.hdr-prepared{font-family:var(--mono);font-size:11px;color:var(--text3);letter-spacing:.02em;}
#inspector-badge{font-family:var(--mono);font-size:11px;color:var(--text-dim);letter-spacing:.3px;text-align:right;}
.main{flex:1;overflow-y:auto;padding:14px;max-width:640px;margin:0 auto;width:100%;}
.main.wide{max-width:1200px;}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:14px;}
.panel-hdr{padding:12px 14px;background:var(--surface2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;}
.panel-title{font-family:var(--cond);font-size:16px;font-weight:700;color:var(--text-bright);}
.panel-sub{font-size:13px;color:var(--text-dim);margin-top:3px;}
.panel-body{padding:14px;}
.sec-label{font-family:var(--mono);font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;margin-top:4px;}
.btn{padding:13px 18px;border:none;border-radius:6px;font-family:var(--cond);font-size:15px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:all .15s;min-height:48px;width:100%;text-align:center;}
.btn-accent{background:var(--accent);color:#fff;}
.btn-accent:hover{opacity:.9;}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text3);}
.btn-ghost:hover{border-color:var(--accent);color:var(--text2);}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5);}
.btn-sm{padding:10px 14px;font-size:13px;border-radius:6px;min-height:48px;width:auto;}
.ff{margin-bottom:12px;}
.ff label{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);display:block;margin-bottom:5px;}
.ff input,.ff select,.ff textarea{width:100%;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-family:var(--sans);font-size:15px;color:var(--text);-webkit-appearance:none;min-height:48px;}
.ff input:focus,.ff select:focus,.ff textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.ff input[type="password"]{letter-spacing:2px;}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 20px;border-radius:6px;font-family:var(--mono);font-size:13px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.ok{background:var(--good-bg);color:var(--good);border:1px solid var(--good-b);}
.toast.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-b);}
.toast.show{opacity:1;}
.screen{display:none;}
.screen.active{display:block;}

/* Assignments */
.assign-card{background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:16px;margin-bottom:10px;cursor:pointer;transition:border-color .2s;min-height:48px;}
.assign-card:hover{border-color:var(--accent);}
.assign-fac{font-family:var(--cond);font-size:18px;font-weight:700;color:var(--text-bright);}
.assign-addr{font-size:13px;color:var(--text-dim);margin-top:4px;}
.assign-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-family:var(--mono);font-size:12px;}
.assign-due{font-weight:700;}
.assign-due.overdue{color:var(--red);}
.assign-due.today{color:var(--warn);}
.assign-due.upcoming{color:var(--good);}
.assign-count{color:var(--text-dim);}

/* Survey layout */
.survey-wrap{display:block;}
.survey-rail{display:none;}
.survey-pane{flex:1;min-width:0;}
.module-block{margin-bottom:24px;}
.module-banner{background:var(--surface2);border:1px solid var(--border);border-radius:6px;padding:12px;margin-bottom:14px;}
.module-banner-title{font-family:var(--cond);font-size:17px;font-weight:700;color:var(--text-bright);}
.module-banner-meta{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:3px;}
.module-notes{font-size:13px;color:var(--text-dim);background:var(--surface2);border-left:3px solid var(--accent);padding:10px 12px;margin-bottom:14px;border-radius:3px;line-height:1.55;}
.module-notes>div{margin-bottom:4px;}
.module-notes>div:last-child{margin-bottom:0;}
.sec-header{padding:8px 0 8px;border-bottom:2px solid var(--accent);margin:18px 0 10px;font-family:var(--cond);font-size:15px;font-weight:700;color:var(--text-bright);letter-spacing:.5px;}
.cl-item{padding:14px 0;border-bottom:1px solid rgba(55,62,71,.5);}
.cl-item:last-child{border-bottom:none;}
.cl-item-text{font-size:14px;color:var(--text);margin-bottom:12px;line-height:1.5;}
.cl-answers{display:flex;gap:8px;}
.cl-answer{flex:1;padding:14px 8px;border-radius:6px;font-family:var(--cond);font-size:15px;font-weight:700;cursor:pointer;border:1px solid var(--border);background:var(--surface2);color:var(--text2);text-align:center;min-height:48px;letter-spacing:.5px;}
.cl-answer.sel-yes{background:var(--good-bg);border-color:var(--good-b);color:var(--good);}
.cl-answer.sel-no{background:var(--red-bg);border-color:var(--red-b);color:var(--red);}
.cl-answer.sel-na{background:var(--warn-bg);border-color:var(--warn-b);color:var(--warn);}
.cl-detail{max-height:0;overflow:hidden;transition:max-height .25s ease;}
.cl-detail.open{max-height:900px;}
.cl-detail-inner{padding:12px 0 4px;}

.submit-bar{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px 14px;margin:20px -14px -14px;display:flex;gap:12px;align-items:center;z-index:10;}
.submit-bar .submit-info{flex:1;font-family:var(--mono);font-size:12px;color:var(--text-dim);line-height:1.4;}
.submit-bar button{flex-shrink:0;width:auto;min-width:180px;}

.jump-bar{margin-bottom:14px;}

@media (min-width:768px){
  .survey-wrap{display:flex;gap:16px;align-items:flex-start;}
  .survey-rail{display:block;width:260px;flex-shrink:0;position:sticky;top:62px;max-height:calc(100vh - 80px);overflow-y:auto;padding:4px;}
  .rail-module{padding:11px 12px;border:1px solid var(--border);border-radius:6px;margin-bottom:8px;cursor:pointer;background:var(--surface);}
  .rail-module.active{border-color:var(--accent);background:var(--accent-l);}
  .rail-module-title{font-family:var(--cond);font-size:14px;font-weight:700;color:var(--text-bright);}
  .rail-module-meta{font-family:var(--mono);font-size:11px;color:var(--text-dim);margin-top:3px;display:flex;justify-content:space-between;align-items:center;}
  .rail-dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle;}
  .rail-dot.red{background:var(--red);}
  .rail-dot.yellow{background:var(--warn);}
  .rail-dot.green{background:var(--good);}
  .rail-sections{margin-top:8px;padding-left:10px;border-left:1px solid var(--border2);display:none;}
  .rail-module.active .rail-sections{display:block;}
  .rail-section{font-size:12px;color:var(--text-dim);padding:5px 0;cursor:pointer;}
  .rail-section:hover{color:var(--accent);}
  .module-block.hidden{display:none;}
  .module-banner{display:none;}
  .jump-bar{display:none;}
  .submit-bar{margin-left:-14px;margin-right:-14px;}
}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-brand">
    <div class="hdr-logo">Amusement <span>Standards</span></div>
    <div class="hdr-divider"></div>
    <div class="hdr-prepared">Inspector Portal</div>
  </div>
  <div id="inspector-badge"></div>
</div>

<div class="main" id="main">
  <div class="screen active" id="screen-login">
    <div class="panel">
      <div class="panel-hdr"><div>
        <div class="panel-title">Inspector Login</div>
        <div class="panel-sub">Sign in to view assigned inspections</div>
      </div></div>
      <div class="panel-body">
        <div class="ff"><label>Email</label><input type="email" id="login-email" placeholder="you@company.com" autocomplete="email"></div>
        <div class="ff"><label>Password</label><input type="password" id="login-password" autocomplete="current-password"></div>
        <button class="btn btn-accent" id="login-btn" onclick="doLogin()">Log In &rarr;</button>
        <div id="login-error" style="font-family:var(--mono);font-size:12px;color:var(--red);margin-top:12px;min-height:16px;text-align:center;"></div>
        <div id="login-retry" style="display:none;margin-top:10px;"><button class="btn btn-ghost" onclick="doLogin()">Retry</button></div>
      </div>
    </div>
  </div>

  <div class="screen" id="screen-assignments">
    <div class="sec-label">// Your Assigned Inspections</div>
    <div id="assignments-list"></div>
  </div>

  <div class="screen" id="screen-survey">
    <div id="survey-container"></div>
  </div>

  <div class="screen" id="screen-confirm">
    <div class="panel" style="text-align:center;">
      <div class="panel-body" style="padding:32px 16px;">
        <div style="font-size:48px;margin-bottom:12px;">&#x2705;</div>
        <div class="panel-title" style="margin-bottom:6px;">Inspection Submitted</div>
        <div class="panel-sub" id="confirm-summary"></div>
        <div style="margin-top:20px;">
          <button class="btn btn-ghost" onclick="backToAssignments()">Back to Assignments</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
var CONFIG = {
  WORKER_URL: 'https://as360-proxy.amusementstandards.workers.dev/airtable',
  BASE_ID: 'appcqRLU10wvA2OCA',
  TABLES: {
    INSPECTORS: 'Inspectors',
    INSPECTIONS: 'Inspections',
    CHECKLIST_MODULES: 'Checklist Modules',
    FACILITIES: 'Facilities',
    CARS: 'CARs'
  }
};

var SEVERITY_OPTIONS = [
  {v:1, label:'Locked out / cannot be used'},
  {v:2, label:'Carrier notification required'},
  {v:3, label:'Correct within 30 days before next setup or use'},
  {v:4, label:'Correct within agreed timeframe'},
  {v:5, label:'Recommendation only'}
];

var state = {
  inspector: null,
  inspections: [],
  facilityCache: {},
  moduleCache: {},
  current: null
};

// ── API HELPERS ──
function apiUrl(table, pathExtra, qs){
  var u = CONFIG.WORKER_URL + '/' + encodeURIComponent(table);
  if(pathExtra) u += '/' + pathExtra;
  u += '?base=' + CONFIG.BASE_ID;
  if(qs) u += '&' + qs;
  return u;
}
async function apiGet(table, pathExtra, qs){
  var res = await fetch(apiUrl(table, pathExtra, qs), {headers:{'Content-Type':'application/json'}});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function apiPatch(table, recordId, fields){
  var res = await fetch(apiUrl(table, recordId), {method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fields:fields})});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
async function apiPost(table, fields){
  var res = await fetch(apiUrl(table), {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({fields:fields})});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  var el = document.getElementById('screen-' + id);
  if(el) el.classList.add('active');
  var main = document.getElementById('main');
  if(id === 'survey') main.classList.add('wide'); else main.classList.remove('wide');
  window.scrollTo(0, 0);
}

function toast(msg, type){
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + (type || 'ok') + ' show';
  setTimeout(function(){ el.classList.remove('show'); }, 3200);
}

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

// ── LOGIN ──
async function doLogin(){
  var email = (document.getElementById('login-email').value || '').trim();
  var pw = (document.getElementById('login-password').value || '').trim();
  var errEl = document.getElementById('login-error');
  var retryEl = document.getElementById('login-retry');
  errEl.textContent = '';
  retryEl.style.display = 'none';
  if(!email || !pw){ errEl.textContent = 'Enter email and password.'; return; }
  var btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Signing in...';
  var emailLower = email.toLowerCase().replace(/'/g, "\\'");
  var pwEsc = pw.replace(/'/g, "\\'");
  var formula = "AND(LOWER({Email})='" + emailLower + "',{Password}='" + pwEsc + "',{Status}='Active')";
  try {
    var data = await apiGet(CONFIG.TABLES.INSPECTORS, null, 'filterByFormula=' + encodeURIComponent(formula));
    document.getElementById('login-password').value = '';
    pw = null; pwEsc = null;
    var recs = data.records || [];
    if(recs.length === 1){
      var r = recs[0];
      state.inspector = {
        recordId: r.id,
        name: r.fields.Name || email,
        inspectorId: r.fields['Inspector ID'] || ''
      };
      document.getElementById('inspector-badge').textContent = state.inspector.name + (state.inspector.inspectorId ? ' · ' + state.inspector.inspectorId : '');
      toast('Welcome, ' + state.inspector.name, 'ok');
      btn.disabled = false; btn.textContent = 'Log In \u2192';
      loadAssignments();
    } else if(recs.length === 0){
      errEl.textContent = 'Invalid credentials.';
      btn.disabled = false; btn.textContent = 'Log In \u2192';
    } else {
      errEl.textContent = 'Account error \u2014 contact administrator.';
      btn.disabled = false; btn.textContent = 'Log In \u2192';
    }
  } catch(e){
    errEl.textContent = 'Cannot reach server. Check connection and retry.';
    retryEl.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Log In \u2192';
  }
}

// ── ASSIGNMENTS ──
async function loadAssignments(){
  showScreen('assignments');
  var list = document.getElementById('assignments-list');
  list.innerHTML = '<div class="panel"><div class="panel-body" style="text-align:center;color:var(--text-dim);font-family:var(--mono);font-size:13px;">Loading assignments\u2026</div></div>';
  var inspectorId = state.inspector.recordId;
  var primaryFormula = "AND(FIND('" + inspectorId + "',ARRAYJOIN({Inspector}))>0,OR({Status}='SCHEDULED',{Status}='ASSIGNED',{Status}='IN FIELD'))";
  var recs = [];
  try {
    var data = await apiGet(CONFIG.TABLES.INSPECTIONS, null, 'filterByFormula=' + encodeURIComponent(primaryFormula));
    recs = data.records || [];
    if(recs.length === 0){
      // Fallback: fetch by status only, filter client-side by linked Inspector array
      var fallbackFormula = "OR({Status}='SCHEDULED',{Status}='ASSIGNED',{Status}='IN FIELD')";
      try {
        var data2 = await apiGet(CONFIG.TABLES.INSPECTIONS, null, 'filterByFormula=' + encodeURIComponent(fallbackFormula));
        recs = (data2.records || []).filter(function(r){
          var arr = r.fields.Inspector || [];
          return arr.indexOf && arr.indexOf(inspectorId) >= 0;
        });
      } catch(e2){ /* ignore */ }
    }
  } catch(e){
    list.innerHTML = '<div class="panel"><div class="panel-body" style="text-align:center;color:var(--red);font-family:var(--mono);font-size:13px;">Failed to load assignments.</div></div>';
    return;
  }
  state.inspections = recs;
  if(recs.length === 0){
    list.innerHTML = '<div class="panel"><div class="panel-body" style="text-align:center;padding:32px 20px;"><div style="font-size:32px;margin-bottom:10px;">&#x1F4CB;</div><div style="color:var(--text-dim);font-size:13px;line-height:1.5;">No assignments scheduled.<br>Check back when your dispatcher schedules an inspection.</div></div></div>';
    return;
  }
  // Fetch facility records for each
  var facIds = {};
  recs.forEach(function(r){
    var arr = r.fields.Facility || [];
    if(arr.length) facIds[arr[0]] = 1;
  });
  var facList = Object.keys(facIds).filter(function(id){ return !state.facilityCache[id]; });
  await Promise.all(facList.map(function(id){
    return apiGet(CONFIG.TABLES.FACILITIES, id).then(function(f){
      state.facilityCache[id] = f.fields || {};
    }).catch(function(){});
  }));
  renderAssignments();
}

function renderAssignments(){
  var list = document.getElementById('assignments-list');
  var today = new Date(); today.setHours(0,0,0,0);
  var html = '';
  state.inspections.forEach(function(r){
    var f = r.fields;
    var facId = (f.Facility || [])[0];
    var fac = facId ? state.facilityCache[facId] : null;
    var facName = fac ? (fac.Name || 'Facility') : 'Facility';
    var addr = fac ? [fac.Address, fac.City, fac.State].filter(function(x){return x;}).join(', ') : '';
    var due = f['Scheduled Date'] || '';
    var dueClass = 'upcoming', dueLabel = 'Due ' + due;
    if(due){
      var d = new Date(due); d.setHours(0,0,0,0);
      if(d < today){ dueClass = 'overdue'; dueLabel = 'OVERDUE \u00b7 ' + due; }
      else if(d.getTime() === today.getTime()){ dueClass = 'today'; dueLabel = 'DUE TODAY'; }
      else { dueLabel = 'Due ' + due; }
    }
    var modCount = (f['Checklist Modules'] || []).length;
    html += '<div class="assign-card" onclick="openAssignment(\'' + r.id + '\')">';
    html += '<div class="assign-fac">' + esc(facName) + '</div>';
    if(addr) html += '<div class="assign-addr">' + esc(addr) + '</div>';
    html += '<div class="assign-row"><span class="assign-due ' + dueClass + '">' + esc(dueLabel) + '</span><span class="assign-count">' + modCount + ' form' + (modCount === 1 ? '' : 's') + '</span></div>';
    html += '</div>';
  });
  list.innerHTML = html;
}

// ── OPEN ASSIGNMENT ──
async function openAssignment(recordId){
  var rec = state.inspections.filter(function(r){return r.id === recordId;})[0];
  if(!rec){ toast('Assignment not found', 'err'); return; }
  var f = rec.fields;
  var facId = (f.Facility || [])[0];
  var moduleIds = f['Checklist Modules'] || [];
  if(moduleIds.length === 0){ toast('No checklist modules attached to this inspection', 'err'); return; }
  showScreen('survey');
  document.getElementById('survey-container').innerHTML = '<div class="panel"><div class="panel-body" style="text-align:center;color:var(--text-dim);font-family:var(--mono);font-size:13px;">Loading checklists\u2026</div></div>';
  try {
    var modsToFetch = moduleIds.filter(function(id){ return !state.moduleCache[id]; });
    await Promise.all(modsToFetch.map(function(id){
      return apiGet(CONFIG.TABLES.CHECKLIST_MODULES, id).then(function(m){
        var parsed = null;
        try { parsed = JSON.parse(m.fields['Sections JSON'] || '{}'); } catch(e){ parsed = null; }
        state.moduleCache[id] = {
          recordId: id,
          moduleId: m.fields['Module ID'] || '',
          attractionType: m.fields['Attraction Type'] || '',
          version: m.fields['Version'] || '',
          title: (parsed && parsed.title) || m.fields['Attraction Type'] || 'Checklist',
          notes: (parsed && parsed.notes) || [],
          sections: (parsed && parsed.sections) || []
        };
      });
    }));
    var modules = moduleIds.map(function(id){ return state.moduleCache[id]; }).filter(function(m){ return m; });
    state.current = {
      inspectionRecordId: rec.id,
      inspectionId: f['Inspection ID'] || rec.id,
      facilityRecordId: facId,
      facility: facId ? state.facilityCache[facId] : {},
      modules: modules,
      items: {},
      activeModuleIdx: 0
    };
    restoreDraft();
    renderSurvey();
  } catch(e){
    document.getElementById('survey-container').innerHTML = '<div class="panel"><div class="panel-body" style="text-align:center;color:var(--red);font-family:var(--mono);font-size:13px;">Failed to load checklist modules.</div></div>';
  }
}

function itemKey(mIdx, sIdx, iIdx){
  return state.current.modules[mIdx].recordId + '::' + sIdx + '::' + iIdx;
}

// ── DRAFT AUTOSAVE ──
function draftKey(){ return 'inspection_draft_' + state.current.inspectionRecordId; }
function saveDraft(){
  if(!state.current) return;
  try {
    var slim = {};
    Object.keys(state.current.items).forEach(function(k){
      var it = state.current.items[k];
      slim[k] = {
        answer: it.answer || null,
        severity: it.severity || null,
        comment: it.comment || '',
        photo: it.photo ? 'captured' : null
      };
    });
    localStorage.setItem(draftKey(), JSON.stringify({items: slim, lastSaved: Date.now()}));
  } catch(e){}
}
function restoreDraft(){
  try {
    var raw = localStorage.getItem(draftKey());
    if(!raw) return;
    var parsed = JSON.parse(raw);
    if(parsed && parsed.items) state.current.items = parsed.items;
  } catch(e){}
}
function clearDraft(){
  try { localStorage.removeItem(draftKey()); } catch(e){}
}

// ── RENDER SURVEY ──
function renderSurvey(){
  var c = state.current;
  var container = document.getElementById('survey-container');
  var facName = (c.facility && c.facility.Name) || 'Facility';
  var facAddr = c.facility ? [c.facility.Address, c.facility.City, c.facility.State].filter(function(x){return x;}).join(', ') : '';

  var html = '';
  html += '<div class="panel"><div class="panel-hdr"><div>';
  html += '<div class="panel-title" style="font-size:18px;">' + esc(facName) + '</div>';
  html += '<div class="panel-sub">' + esc(facAddr || c.inspectionId) + (facAddr ? ' \u00b7 ' + esc(c.inspectionId) : '') + '</div>';
  html += '</div><button class="btn btn-ghost btn-sm" onclick="backToAssignments()">\u2190 Back</button></div>';
  html += '<div class="panel-body">';

  // Phone jump dropdown
  html += '<div class="jump-bar ff"><label>Jump To Section</label><select id="jump-select" onchange="jumpTo(this.value)">';
  html += '<option value="">\u2014 Select \u2014</option>';
  c.modules.forEach(function(m, mi){
    m.sections.forEach(function(s, si){
      html += '<option value="' + mi + '-' + si + '">' + esc(m.attractionType) + ' \u00b7 ' + esc(s.name) + '</option>';
    });
  });
  html += '</select></div>';

  html += '<div class="survey-wrap">';

  // LEFT RAIL (tablet only)
  html += '<div class="survey-rail" id="survey-rail">';
  html += '<div style="font-family:var(--mono);font-size:10px;color:var(--text-dim);letter-spacing:1.5px;margin-bottom:8px;">// SURVEY</div>';
  html += '<div style="font-family:var(--cond);font-size:16px;font-weight:700;color:var(--text-bright);margin-bottom:10px;line-height:1.25;">' + esc(facName) + '</div>';
  c.modules.forEach(function(m, mi){
    html += '<div class="rail-module' + (mi === c.activeModuleIdx ? ' active' : '') + '" data-idx="' + mi + '" onclick="setActiveModule(' + mi + ')">';
    html += '<div class="rail-module-title">' + esc(m.attractionType || m.title) + '</div>';
    html += '<div class="rail-module-meta"><span>' + esc(m.version) + '</span><span id="rail-count-' + mi + '"></span></div>';
    html += '<div class="rail-sections">';
    m.sections.forEach(function(s, si){
      html += '<div class="rail-section" onclick="event.stopPropagation();jumpTo(\'' + mi + '-' + si + '\')">' + esc(s.name) + '</div>';
    });
    html += '</div>';
    html += '</div>';
  });
  html += '</div>';

  // RIGHT PANE
  html += '<div class="survey-pane" id="survey-pane">';
  c.modules.forEach(function(m, mi){
    var hiddenClass = mi === c.activeModuleIdx ? '' : ' hidden';
    html += '<div class="module-block' + hiddenClass + '" id="module-block-' + mi + '">';
    html += '<div class="module-banner"><div class="module-banner-title">' + esc(m.title) + '</div><div class="module-banner-meta">' + esc(m.attractionType) + ' \u00b7 ' + esc(m.version) + '</div></div>';
    if(m.notes && m.notes.length){
      html += '<div class="module-notes">';
      m.notes.forEach(function(n){ html += '<div>' + esc(n) + '</div>'; });
      html += '</div>';
    }
    m.sections.forEach(function(s, si){
      html += '<div class="sec-header" id="anchor-' + mi + '-' + si + '">' + (si + 1) + '. ' + esc((s.name || '').toUpperCase()) + '</div>';
      (s.items || []).forEach(function(item, ii){
        var k = itemKey(mi, si, ii);
        var it = c.items[k] || {};
        html += '<div class="cl-item">';
        html += '<div class="cl-item-text">' + esc(item) + '</div>';
        html += '<div class="cl-answers">';
        html += '<div class="cl-answer' + (it.answer === 'yes' ? ' sel-yes' : '') + '" id="ans-yes-' + k + '" onclick="setAnswer(\'' + k + '\',\'yes\')">YES</div>';
        html += '<div class="cl-answer' + (it.answer === 'no' ? ' sel-no' : '') + '" id="ans-no-' + k + '" onclick="setAnswer(\'' + k + '\',\'no\')">NO</div>';
        html += '<div class="cl-answer' + (it.answer === 'na' ? ' sel-na' : '') + '" id="ans-na-' + k + '" onclick="setAnswer(\'' + k + '\',\'na\')">N/A</div>';
        html += '</div>';
        html += '<div class="cl-detail' + (it.answer ? ' open' : '') + '" id="detail-' + k + '"><div class="cl-detail-inner">';
        // Severity (NO only)
        html += '<div id="sev-wrap-' + k + '" style="display:' + (it.answer === 'no' ? 'block' : 'none') + ';margin-bottom:10px;">';
        html += '<label style="font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);display:block;margin-bottom:5px;">Severity *</label>';
        html += '<select onchange="setSeverity(\'' + k + '\',this.value)" style="width:100%;padding:12px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-family:var(--sans);font-size:14px;color:var(--text);min-height:48px;">';
        html += '<option value="">\u2014 Select severity \u2014</option>';
        SEVERITY_OPTIONS.forEach(function(opt){
          html += '<option value="' + opt.v + '"' + (it.severity == opt.v ? ' selected' : '') + '>' + opt.v + ' \u00b7 ' + esc(opt.label) + '</option>';
        });
        html += '</select></div>';
        // Comment
        html += '<label style="font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);display:block;margin-bottom:5px;">Comment</label>';
        html += '<textarea placeholder="Optional notes\u2026" rows="2" oninput="setComment(\'' + k + '\',this.value)" style="width:100%;padding:10px;background:var(--surface2);border:1px solid var(--border);border-radius:6px;font-family:var(--mono);font-size:13px;color:var(--text);resize:vertical;min-height:48px;">' + esc(it.comment || '') + '</textarea>';
        // Photo (NO only)
        html += '<div id="photo-wrap-' + k + '" style="display:' + (it.answer === 'no' ? 'block' : 'none') + ';margin-top:10px;">';
        html += '<label style="font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);display:block;margin-bottom:5px;">Photo Evidence</label>';
        html += '<button class="btn btn-ghost btn-sm" onclick="document.getElementById(\'photo-' + k + '\').click()">&#x1F4F7; Attach Photo</button>';
        html += '<input type="file" id="photo-' + k + '" accept="image/*" capture="camera" style="display:none;" onchange="setPhoto(\'' + k + '\',this)">';
        html += '<span id="photo-label-' + k + '" style="font-family:var(--mono);font-size:11px;color:var(--text-muted);margin-left:10px;">' + (it.photo ? '\u2713 Attached' : '') + '</span>';
        html += '</div>';
        html += '</div></div>'; // detail-inner, cl-detail
        html += '</div>'; // cl-item
      });
    });
    html += '</div>'; // module-block
  });

  // Submit bar
  html += '<div class="submit-bar"><div class="submit-info" id="submit-info">\u2014</div>';
  html += '<button class="btn btn-accent" id="submit-btn" onclick="submitInspection()" disabled>Submit Inspection \u2192</button></div>';

  html += '</div>'; // survey-pane
  html += '</div>'; // survey-wrap
  html += '</div></div>'; // panel-body, panel

  container.innerHTML = html;
  updateValidation();
  updateRailCounts();
}

function setActiveModule(idx){
  state.current.activeModuleIdx = idx;
  document.querySelectorAll('.rail-module').forEach(function(el){
    el.classList.toggle('active', parseInt(el.getAttribute('data-idx'), 10) === idx);
  });
  document.querySelectorAll('.module-block').forEach(function(el, i){
    el.classList.toggle('hidden', i !== idx);
  });
}

function jumpTo(val){
  if(!val) return;
  var parts = val.split('-');
  var mi = parseInt(parts[0], 10); var si = parseInt(parts[1], 10);
  if(window.innerWidth >= 768) setActiveModule(mi);
  var el = document.getElementById('anchor-' + mi + '-' + si);
  if(el) el.scrollIntoView({behavior:'smooth', block:'start'});
}

function setAnswer(k, ans){
  var it = state.current.items[k] || {};
  it.answer = ans;
  if(ans !== 'no'){ it.severity = null; it.photo = null; }
  state.current.items[k] = it;
  ['yes','no','na'].forEach(function(a){
    var el = document.getElementById('ans-' + a + '-' + k);
    if(el) el.classList.remove('sel-yes','sel-no','sel-na');
  });
  var selEl = document.getElementById('ans-' + ans + '-' + k);
  if(selEl) selEl.classList.add('sel-' + ans);
  var detail = document.getElementById('detail-' + k);
  if(detail) detail.classList.add('open');
  var sev = document.getElementById('sev-wrap-' + k);
  if(sev) sev.style.display = ans === 'no' ? 'block' : 'none';
  var pw = document.getElementById('photo-wrap-' + k);
  if(pw) pw.style.display = ans === 'no' ? 'block' : 'none';
  saveDraft();
  updateValidation();
  updateRailCounts();
}

function setSeverity(k, v){
  var it = state.current.items[k] || {};
  it.severity = v ? parseInt(v, 10) : null;
  state.current.items[k] = it;
  saveDraft();
  updateValidation();
  updateRailCounts();
}

function setComment(k, v){
  var it = state.current.items[k] || {};
  it.comment = v;
  state.current.items[k] = it;
  saveDraft();
}

function setPhoto(k, input){
  if(!input.files || !input.files[0]) return;
  var file = input.files[0];
  var reader = new FileReader();
  reader.onload = function(e){
    var it = state.current.items[k] || {};
    it.photo = e.target.result;
    state.current.items[k] = it;
    var lbl = document.getElementById('photo-label-' + k);
    if(lbl) lbl.textContent = '\u2713 ' + file.name.substring(0, 24);
    saveDraft();
  };
  reader.readAsDataURL(file);
}

function countModule(mi){
  var m = state.current.modules[mi];
  var total = 0, answered = 0, noMissingSev = 0;
  m.sections.forEach(function(s, si){
    (s.items || []).forEach(function(_, ii){
      total++;
      var it = state.current.items[itemKey(mi, si, ii)];
      if(it && it.answer){
        answered++;
        if(it.answer === 'no' && !it.severity) noMissingSev++;
      }
    });
  });
  return {total: total, answered: answered, noMissingSev: noMissingSev};
}

function updateRailCounts(){
  state.current.modules.forEach(function(m, mi){
    var c = countModule(mi);
    var el = document.getElementById('rail-count-' + mi);
    if(el){
      var dot = 'red';
      if(c.answered === c.total && c.noMissingSev === 0 && c.total > 0) dot = 'green';
      else if(c.answered > 0) dot = 'yellow';
      el.innerHTML = '<span class="rail-dot ' + dot + '"></span>' + c.answered + '/' + c.total;
    }
  });
}

function updateValidation(){
  var unanswered = 0, noMissingSev = 0, total = 0;
  state.current.modules.forEach(function(m, mi){
    var c = countModule(mi);
    total += c.total;
    unanswered += (c.total - c.answered);
    noMissingSev += c.noMissingSev;
  });
  var btn = document.getElementById('submit-btn');
  var info = document.getElementById('submit-info');
  var ok = unanswered === 0 && noMissingSev === 0 && total > 0;
  if(btn) btn.disabled = !ok;
  if(info){
    if(ok){
      info.textContent = 'Ready to submit \u00b7 ' + total + ' items';
    } else {
      var msgs = [];
      if(unanswered) msgs.push(unanswered + ' item' + (unanswered === 1 ? '' : 's') + ' unanswered');
      if(noMissingSev) msgs.push(noMissingSev + ' NO missing severity');
      info.textContent = msgs.join(' \u00b7 ') || (total + ' items total');
    }
  }
}

// ── SUBMIT ──
async function submitInspection(){
  var c = state.current;
  var items = [];
  c.modules.forEach(function(m, mi){
    m.sections.forEach(function(s, si){
      (s.items || []).forEach(function(text, ii){
        var it = c.items[itemKey(mi, si, ii)] || {};
        items.push({
          module_id: m.moduleId,
          section: s.name,
          item: text,
          answer: it.answer || null,
          severity: it.severity || null,
          comment: it.comment || '',
          photo: it.photo ? 'captured' : null
        });
      });
    });
  });
  var bad = items.filter(function(x){ return !x.answer || (x.answer === 'no' && !x.severity); });
  if(bad.length){ toast('Incomplete \u2014 ' + bad.length + ' item' + (bad.length === 1 ? '' : 's') + ' need attention', 'err'); return; }

  var btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.textContent = 'Submitting\u2026';
  var now = new Date();
  var inspectionUpdate = {
    'Items JSON': JSON.stringify(items),
    'Status': 'SUBMITTED',
    'Submitted At': now.toISOString()
  };

  try {
    await apiPatch(CONFIG.TABLES.INSPECTIONS, c.inspectionRecordId, inspectionUpdate);
    // CARs for sev 1-2
    var sevFails = items.filter(function(x){ return x.answer === 'no' && (x.severity === 1 || x.severity === 2); });
    var carIds = [];
    if(sevFails.length){
      var startSeq = await nextCarSequence();
      for(var i = 0; i < sevFails.length; i++){
        var sf = sevFails[i];
        var carId;
        if(startSeq === null){
          carId = 'CAR-' + now.getFullYear() + '-T' + (Math.floor(now.getTime() / 1000) + i);
        } else {
          var seq = String(startSeq + i);
          while(seq.length < 4) seq = '0' + seq;
          carId = 'CAR-' + now.getFullYear() + '-' + seq;
        }
        var dueDays = sf.severity === 1 ? 0 : 7;
        var due = new Date(now); due.setDate(due.getDate() + dueDays);
        var carFields = {
          'CAR ID': carId,
          'Inspection': [c.inspectionRecordId],
          'Item Text': sf.item,
          'Severity': sf.severity,
          'Assigned Inspector': state.inspector.name,
          'Opened Date': now.toISOString().split('T')[0],
          'Due Date': due.toISOString().split('T')[0],
          'Status': 'OPEN'
        };
        if(c.facilityRecordId) carFields['Facility'] = [c.facilityRecordId];
        try {
          await apiPost(CONFIG.TABLES.CARS, carFields);
          carIds.push(carId);
        } catch(ce){ /* non-fatal */ }
      }
    }
    clearDraft();
    drainPendingQueue();
    var facName = (c.facility && c.facility.Name) || 'Facility';
    document.getElementById('confirm-summary').innerHTML =
      esc(c.inspectionId) + '<br>' +
      esc(facName) + '<br>' +
      items.length + ' items submitted' +
      (carIds.length ? '<br><span style="color:var(--red);font-weight:700;">' + carIds.length + ' CAR' + (carIds.length === 1 ? '' : 's') + ' generated</span>' : '') +
      '<br><span style="font-family:var(--mono);font-size:11px;color:var(--text-muted);">Tom and underwriting have been notified</span>';
    showScreen('confirm');
    toast('Inspection submitted', 'ok');
  } catch(e){
    // Queue for retry
    var queue = [];
    try { queue = JSON.parse(localStorage.getItem('pending_submissions') || '[]'); } catch(_){}
    queue.push({
      inspectionRecordId: c.inspectionRecordId,
      update: inspectionUpdate,
      ts: Date.now()
    });
    try { localStorage.setItem('pending_submissions', JSON.stringify(queue)); } catch(_){}
    toast('Submit failed \u2014 saved locally. Will retry on next online.', 'err');
    btn.disabled = false; btn.textContent = 'Submit Inspection \u2192';
  }
}

async function nextCarSequence(){
  try {
    var data = await apiGet(CONFIG.TABLES.CARS);
    var max = 0;
    (data.records || []).forEach(function(r){
      var id = r.fields['CAR ID'] || '';
      var m = /CAR-\d{4}-(\d+)$/.exec(id);
      if(m){ var n = parseInt(m[1], 10); if(n > max) max = n; }
    });
    return max + 1;
  } catch(e){ return null; }
}

async function drainPendingQueue(){
  if(!navigator.onLine) return;
  var queue = [];
  try { queue = JSON.parse(localStorage.getItem('pending_submissions') || '[]'); } catch(_){ return; }
  if(!queue.length) return;
  var remaining = [];
  for(var i = 0; i < queue.length; i++){
    try {
      await apiPatch(CONFIG.TABLES.INSPECTIONS, queue[i].inspectionRecordId, queue[i].update);
    } catch(e){ remaining.push(queue[i]); }
  }
  try { localStorage.setItem('pending_submissions', JSON.stringify(remaining)); } catch(_){}
}

function backToAssignments(){
  state.current = null;
  loadAssignments();
}

// Startup
if(navigator.onLine) drainPendingQueue();
window.addEventListener('online', drainPendingQueue);
</script>
