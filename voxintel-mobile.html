 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VoxIntel</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080c10;--bg2:#0d1117;--bg3:#131920;--border:#1e2a35;--border2:#243040;
  --text:#c8d8e8;--dim:#4a6070;--bright:#e8f4ff;
  --green:#00e676;--red:#ff3d4a;--amber:#ffab00;--cyan:#00d4ff;--blue:#4488ff;--purple:#cc88ff;
  --mono:'Share Tech Mono',monospace;--sans:'Barlow',sans-serif;--cond:'Barlow Condensed',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;min-height:100dvh;overflow-x:hidden;padding-bottom:70px}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.brand-name{font-family:var(--mono);font-size:16px;color:var(--cyan);letter-spacing:4px}
.topbar-right{display:flex;align-items:center;gap:12px}
.freq-badge{font-family:var(--mono);font-size:9px;color:var(--amber);background:rgba(255,171,0,0.08);border:1px solid rgba(255,171,0,0.2);padding:3px 7px;border-radius:2px;letter-spacing:1px}
.status-pill{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);flex-shrink:0}
.pulse-dot.live{background:var(--green);box-shadow:0 0 8px var(--green);animation:pulse 2s infinite}
.pulse-dot.error{background:var(--red);box-shadow:0 0 8px var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.4}}
.stats-strip{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--border)}
.stat{padding:12px 14px;border-right:1px solid var(--border)}
.stat:nth-child(3),.stat:nth-child(6){border-right:none}
.stat-val{font-family:var(--mono);font-size:22px;color:var(--bright);line-height:1;margin-bottom:3px}
.stat-val.red{color:var(--red)}.stat-val.amber{color:var(--amber)}.stat-val.green{color:var(--green)}.stat-val.cyan{color:var(--cyan)}
.stat-label{font-family:var(--cond);font-size:9px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase}
.tab-nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg2);border-top:1px solid var(--border);z-index:100}
.tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 4px;background:none;border:none;cursor:pointer;gap:3px;border-top:2px solid transparent;transition:border-color 0.15s}
.tab-btn.active{border-top-color:var(--cyan)}
.tab-icon{font-size:18px}
.tab-label{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.tab-btn.active .tab-label{color:var(--cyan)}
.tab-badge{position:absolute;top:6px;right:calc(50% - 16px);background:var(--red);color:#fff;font-family:var(--mono);font-size:9px;padding:1px 5px;border-radius:10px;min-width:18px;text-align:center}
.tab-content{display:none}
.tab-content.active{display:block}
.feed-item{padding:12px 16px;border-bottom:1px solid var(--border);border-left:3px solid transparent;animation:fadeIn 0.25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.feed-item.EMERGENCY,.feed-item.FIRE{border-left-color:var(--red);background:rgba(255,61,74,0.06)}
.feed-item.MEDICAL{border-left-color:#ff6b6b;background:rgba(255,107,107,0.04)}
.feed-item.RIDE_DOWN{border-left-color:var(--amber);background:rgba(255,171,0,0.05)}
.feed-item.SECURITY{border-left-color:var(--purple);background:rgba(204,136,255,0.04)}
.feed-item.MAINTENANCE{border-left-color:var(--blue);background:rgba(68,136,255,0.05)}
.feed-item.RIDE_UP{border-left-color:var(--green);background:rgba(0,230,118,0.05)}
.feed-item.WEATHER{border-left-color:var(--cyan);background:rgba(0,212,255,0.05)}
.feed-top{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.feed-cat{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border-radius:2px;font-weight:600}
.feed-cat.EMERGENCY,.feed-cat.FIRE{background:rgba(255,61,74,0.12);color:var(--red)}
.feed-cat.MEDICAL{background:rgba(255,107,107,0.1);color:#ff6b6b}
.feed-cat.RIDE_DOWN{background:rgba(255,171,0,0.1);color:var(--amber)}
.feed-cat.RIDE_UP{background:rgba(0,230,118,0.1);color:var(--green)}
.feed-cat.SECURITY{background:rgba(204,136,255,0.1);color:var(--purple)}
.feed-cat.MAINTENANCE{background:rgba(68,136,255,0.1);color:var(--blue)}
.feed-cat.WEATHER{background:rgba(0,212,255,0.1);color:var(--cyan)}
.feed-cat.DISPATCH,.feed-cat.ROUTINE,.feed-cat.UNKNOWN{background:rgba(74,96,112,0.15);color:var(--dim)}
.feed-time{font-family:var(--mono);font-size:10px;color:var(--dim);margin-left:auto}
.feed-text{font-size:14px;color:var(--text);line-height:1.45;margin-bottom:6px}
.feed-meta{display:flex;flex-wrap:wrap;gap:8px}
.feed-badge{font-family:var(--mono);font-size:10px;color:var(--dim)}
.feed-badge.ride{color:var(--amber)}.feed-badge.conf{color:var(--cyan)}.feed-badge.sig{color:var(--purple)}
.ride-list{padding:12px;display:flex;flex-direction:column;gap:8px}
.ride-card{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-left:4px solid var(--dim)}
.ride-card.OPERATIONAL{border-left-color:var(--green)}
.ride-card.DOWN_MECHANICAL,.ride-card.DOWN_INCIDENT,.ride-card.DOWN_WEATHER,.ride-card.DOWN_OPERATIONS,.ride-card.DOWN_UNKNOWN{border-left-color:var(--red);background:rgba(255,61,74,0.04)}
.ride-info{flex:1}
.ride-name{font-family:var(--cond);font-size:16px;font-weight:700;color:var(--bright);margin-bottom:3px}
.ride-status{font-family:var(--mono);font-size:10px;letter-spacing:1px;text-transform:uppercase}
.ride-status.OPERATIONAL{color:var(--green)}.ride-status.DOWN_MECHANICAL,.ride-status.DOWN_INCIDENT,.ride-status.DOWN_WEATHER,.ride-status.DOWN_OPERATIONS,.ride-status.DOWN_UNKNOWN{color:var(--red)}.ride-status.UNKNOWN{color:var(--dim)}
.ride-since{font-family:var(--mono);font-size:10px;color:var(--dim);margin-top:2px}
.ride-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0;margin-left:12px}
.ride-dot.OPERATIONAL{background:var(--green);box-shadow:0 0 8px var(--green)}
.ride-dot.DOWN_MECHANICAL,.ride-dot.DOWN_INCIDENT,.ride-dot.DOWN_WEATHER,.ride-dot.DOWN_OPERATIONS,.ride-dot.DOWN_UNKNOWN{background:var(--red);box-shadow:0 0 8px var(--red);animation:pulse 1.5s infinite}
.ride-dot.UNKNOWN{background:var(--dim)}
.incident-list{padding:12px;display:flex;flex-direction:column;gap:8px}
.incident-card{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;padding:14px 16px;border-left:4px solid var(--red)}
.incident-card.MEDIUM{border-left-color:var(--amber)}.incident-card.LOW{border-left-color:var(--blue)}.incident-card.CRITICAL{border-left-color:var(--red);background:rgba(255,61,74,0.06)}
.incident-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.incident-id{font-family:var(--mono);font-size:9px;color:var(--dim);letter-spacing:1px}
.incident-sev{font-family:var(--mono);font-size:9px;letter-spacing:1px;padding:2px 6px;border-radius:2px}
.incident-sev.CRITICAL{background:rgba(255,61,74,0.12);color:var(--red)}.incident-sev.HIGH{background:rgba(255,61,74,0.1);color:#ff7070}.incident-sev.MEDIUM{background:rgba(255,171,0,0.1);color:var(--amber)}.incident-sev.LOW{background:rgba(68,136,255,0.1);color:var(--blue)}
.incident-cat{font-family:var(--cond);font-size:15px;font-weight:700;color:var(--bright);margin-bottom:4px}
.incident-loc{font-family:var(--mono);font-size:10px;color:var(--amber);margin-bottom:4px}
.incident-desc{font-size:13px;color:var(--dim);line-height:1.4}
.incident-time{font-family:var(--mono);font-size:9px;color:var(--dim);margin-top:6px}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;gap:10px;text-align:center}
.empty-icon{font-size:36px;opacity:0.3}
.empty-text{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:1px}
.section-header{display:flex;align-items:center;justify-content:space-between;padding:10px 16px;background:var(--bg2);border-bottom:1px solid var(--border);position:sticky;top:52px;z-index:50}
.section-title{font-family:var(--cond);font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--dim)}
.section-count{font-family:var(--mono);font-size:11px;color:var(--dim)}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border2)}
</style>
</head>
<body>

<div class="topbar">
  <div class="brand-name">VOXINTEL</div>
  <div class="topbar-right">
    <div class="freq-badge">464.975</div>
    <div class="status-pill">
      <div class="pulse-dot" id="statusDot"></div>
      <span id="statusText" style="color:var(--dim)">...</span>
    </div>
  </div>
</div>

<div class="stats-strip">
  <div class="stat"><div class="stat-val" id="sTotalEvents">0</div><div class="stat-label">Events</div></div>
  <div class="stat"><div class="stat-val red" id="sEmergencies">0</div><div class="stat-label">Emerg.</div></div>
  <div class="stat"><div class="stat-val amber" id="sRidesDown">0</div><div class="stat-label">Down</div></div>
  <div class="stat"><div class="stat-val green" id="sClassRate">--%</div><div class="stat-label">Classif.</div></div>
  <div class="stat"><div class="stat-val cyan" id="sAvgConf">--%</div><div class="stat-label">Conf.</div></div>
  <div class="stat"><div class="stat-val" id="sLastEvent" style="font-size:14px;padding-top:4px">--</div><div class="stat-label">Last Evt</div></div>
</div>

<div class="tab-content active" id="tab-feed">
  <div class="section-header">
    <div class="section-title">Live Radio Feed</div>
    <div class="section-count" id="feedCount">0 events</div>
  </div>
  <div id="liveFeed">
    <div class="empty-state"><div class="empty-icon">🎙</div><div class="empty-text">CONNECTING...</div></div>
  </div>
</div>

<div class="tab-content" id="tab-rides">
  <div class="section-header">
    <div class="section-title">Ride Status</div>
    <div class="section-count" id="rideCount">0 rides</div>
  </div>
  <div class="ride-list" id="rideBoard">
    <div class="empty-state"><div class="empty-icon">🎢</div><div class="empty-text">NO RIDE DATA YET</div></div>
  </div>
</div>

<div class="tab-content" id="tab-incidents">
  <div class="section-header">
    <div class="section-title">Incident Log</div>
    <div class="section-count" id="incidentCount">0 incidents</div>
  </div>
  <div class="incident-list" id="incidentList">
    <div class="empty-state"><div class="empty-icon">🛡</div><div class="empty-text">NO INCIDENTS LOGGED</div></div>
  </div>
</div>

<nav class="tab-nav">
  <button class="tab-btn active" onclick="switchTab('feed',this)"><span class="tab-icon">🎙</span><span class="tab-label">Feed</span></button>
  <button class="tab-btn" onclick="switchTab('rides',this)" style="position:relative"><span class="tab-icon">🎢</span><span class="tab-label">Rides</span><span class="tab-badge" id="downBadge" style="display:none">0</span></button>
  <button class="tab-btn" onclick="switchTab('incidents',this)" style="position:relative"><span class="tab-icon">🛡</span><span class="tab-label">Incidents</span><span class="tab-badge" id="incBadge" style="display:none">0</span></button>
</nav>

<script>
const WORKER_URL = 'https://voxintel-proxy.amusementstandards.workers.dev';
let pollTimer=null, allEvents=[], rideStatuses={}, incidents=[], lastSeenId=null;

function switchTab(n,btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+n).classList.add('active');
  btn.classList.add('active');
}

function setStatus(s){
  const dot=document.getElementById('statusDot'),txt=document.getElementById('statusText');
  dot.className='pulse-dot '+s;
  txt.textContent=s==='live'?'LIVE':s==='error'?'ERR':'...';
  txt.style.color=s==='live'?'var(--green)':s==='error'?'var(--red)':'var(--dim)';
}

async function fetchEvents(base){
  try{
    const p=new URLSearchParams({'sort[0][field]':'Timestamp','sort[0][direction]':'desc',maxRecords:50});
    const res=await fetch(`${base}/airtable/Radio_Log?${p}`);
    if(!res.ok) throw new Error();
    const data=await res.json();
    setStatus('live');
    if(data.records?.length){
      const nr=lastSeenId?data.records.filter(r=>!allEvents.find(e=>e.id===r.id)):data.records;
      if(nr.length){ lastSeenId=data.records[0].id; nr.forEach(processRecord); renderFeed(); updateStats(); }
    }
    const rr=await fetch(`${base}/airtable/Ride_Status?maxRecords=100`);
    if(rr.ok){ const rd=await rr.json(); if(rd.records){ rideStatuses={}; rd.records.forEach(r=>{ rideStatuses[r.id]={name:r.fields['Ride Name']||'Unknown',status:r.fields['Current Status']||'UNKNOWN',since:r.fields['Down Since']||null}; }); renderRideBoard(); } }
    const ir=await fetch(`${base}/airtable/Incident_QuickLog?sort[0][field]=Timestamp&sort[0][direction]=desc&maxRecords=30`);
    if(ir.ok){ const id=await ir.json(); if(id.records){ incidents=id.records.map(r=>r.fields); renderIncidents(); } }
  }catch(e){ setStatus('error'); }
}

function processRecord(rec){
  const f=rec.fields;
  allEvents.unshift({id:rec.id,timestamp:f['Timestamp']||'',category:f['Event Category']||'UNKNOWN',transcript:f['Cleaned Transcript']||f['Raw Transcript']||'',confidence:f['Confidence']||0,ride:f['Ride Mentioned']||'',signal:f['Signal Code']||'',duration:f['Duration Sec']||0,channel:f['Channel Label']||''});
  if(allEvents.length>200) allEvents=allEvents.slice(0,200);
}

function renderFeed(){
  const feed=document.getElementById('liveFeed');
  if(!allEvents.length) return;
  feed.innerHTML=allEvents.slice(0,100).map(ev=>{
    const cat=ev.category||'UNKNOWN';
    const conf=typeof ev.confidence==='number'?ev.confidence.toFixed(0):ev.confidence;
    const t=ev.timestamp?new Date(ev.timestamp).toLocaleTimeString('en-US',{hour12:true,hour:'numeric',minute:'2-digit'}):'--';
    let m=[];
    if(ev.ride) m.push(`<span class="feed-badge ride">🎢 ${esc(ev.ride)}</span>`);
    if(conf) m.push(`<span class="feed-badge conf">${conf}%</span>`);
    if(ev.signal) m.push(`<span class="feed-badge sig">${esc(ev.signal)}</span>`);
    if(ev.duration) m.push(`<span class="feed-badge">${parseFloat(ev.duration).toFixed(1)}s</span>`);
    return `<div class="feed-item ${cat}"><div class="feed-top"><span class="feed-cat ${cat}">${cat.replace('_',' ')}</span><span class="feed-time">${t}</span></div><div class="feed-text">${esc(ev.transcript)||'<span style="color:var(--dim);font-style:italic">No transcript</span>'}</div>${m.length?`<div class="feed-meta">${m.join('')}</div>`:''}</div>`;
  }).join('');
  document.getElementById('feedCount').textContent=`${allEvents.length} events`;
}

function renderRideBoard(){
  const rides=Object.values(rideStatuses);
  if(!rides.length) return;
  rides.sort((a,b)=>(a.status.startsWith('DOWN')?0:1)-(b.status.startsWith('DOWN')?0:1));
  document.getElementById('rideBoard').innerHTML=rides.map(r=>{
    const s=r.since?new Date(r.since).toLocaleTimeString('en-US',{hour12:true,hour:'numeric',minute:'2-digit'}):'';
    return `<div class="ride-card ${r.status}"><div class="ride-info"><div class="ride-name">${esc(r.name)}</div><div class="ride-status ${r.status}">${r.status.replace(/_/g,' ')}</div>${s?`<div class="ride-since">Down since ${s}</div>`:''}</div><div class="ride-dot ${r.status}"></div></div>`;
  }).join('');
  const dc=rides.filter(r=>r.status.startsWith('DOWN')).length;
  document.getElementById('rideCount').textContent=`${rides.length} rides`;
  const b=document.getElementById('downBadge');
  b.style.display=dc>0?'block':'none'; b.textContent=dc;
}

function renderIncidents(){
  if(!incidents.length) return;
  document.getElementById('incidentList').innerHTML=incidents.map(f=>{
    const sev=f['Severity']||'MEDIUM';
    const ts=f['Timestamp']?new Date(f['Timestamp']).toLocaleTimeString('en-US',{hour12:true,hour:'numeric',minute:'2-digit'}):'--';
    return `<div class="incident-card ${sev}"><div class="incident-top"><div class="incident-id">${esc(f['Incident ID']||'')}</div><div class="incident-sev ${sev}">${sev}</div></div><div class="incident-cat">${esc(f['Category']||'')}</div>${f['Location / Ride']?`<div class="incident-loc">📍 ${esc(f['Location / Ride'])}</div>`:''}<div class="incident-desc">${esc((f['Description']||'').slice(0,140))}</div><div class="incident-time">${ts}</div></div>`;
  }).join('');
  const c=incidents.length;
  document.getElementById('incidentCount').textContent=`${c} incidents`;
  const b=document.getElementById('incBadge');
  b.style.display=c>0?'block':'none'; b.textContent=c;
}

function updateStats(){
  const total=allEvents.length;
  const emerg=allEvents.filter(e=>['EMERGENCY','FIRE','MEDICAL'].includes(e.category)).length;
  const down=Object.values(rideStatuses).filter(r=>r.status.startsWith('DOWN')).length;
  const cls=allEvents.filter(e=>e.category&&e.category!=='UNKNOWN').length;
  const confs=allEvents.map(e=>parseFloat(e.confidence)).filter(c=>!isNaN(c)&&c>0);
  const avgC=confs.length?Math.round(confs.reduce((a,b)=>a+b,0)/confs.length):0;
  const lastTs=allEvents[0]?.timestamp;
  document.getElementById('sTotalEvents').textContent=total;
  document.getElementById('sEmergencies').textContent=emerg;
  document.getElementById('sRidesDown').textContent=down;
  document.getElementById('sClassRate').textContent=total?Math.round(cls/total*100)+'%':'--%';
  document.getElementById('sAvgConf').textContent=avgC?avgC+'%':'--%';
  document.getElementById('sLastEvent').textContent=lastTs?new Date(lastTs).toLocaleTimeString('en-US',{hour12:true,hour:'numeric',minute:'2-digit'}):'--';
}

function esc(s){ if(!s)return''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// Auto-connect on load
window.addEventListener('load',()=>{
  fetchEvents(WORKER_URL);
  pollTimer=setInterval(()=>fetchEvents(WORKER_URL),10000);
});
</script>
</body>
</html>
