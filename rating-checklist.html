<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AmusementRating — Guest Journey Audit</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#FAFAFA;--card:#fff;--border:#E5E7EB;--text:#374151;--dim:#9CA3AF;--dark:#0F172A;--dark2:#1E293B;--fire:#FF4B1F;--fire2:#FF9068;--green:#059669;--greenbg:#ECFDF5;--greenbd:#86EFAC;--indigo:#4338CA;--indigo2:#6366F1;--indigobg:#EEF2FF;--indigobd:#C7D2FE;--purple:#7C3AED;--purplebg:#F5F3FF;--purplebd:#E9D5FF;--mono:'IBM Plex Mono',monospace;--sans:'DM Sans',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,textarea{font-family:var(--sans)}
input:focus,textarea:focus{outline:none;border-color:var(--fire)!important}
.mono{font-family:var(--mono)}
@keyframes su{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pu{0%,100%{opacity:1}50%{opacity:.3}}
.su{animation:su .3s ease-out both}

/* PILLAR BADGES */
.bdg{display:inline-block;font-family:var(--mono);font-weight:700;letter-spacing:.06em;line-height:1.6;border-radius:4px;font-size:9.5px;padding:1px 7px}
.bdg-md{font-size:11px;padding:3px 10px;border-radius:5px}
.bdg-O{color:#0D9488;background:#CCFBF1;border:1px solid #5EEAD4}
.bdg-S{color:#DC2626;background:#FEE2E2;border:1px solid #FCA5A5}
.bdg-G{color:#2563EB;background:#DBEAFE;border:1px solid #93C5FD}
.bdg-F{color:#B45309;background:#FEF3C7;border:1px solid #FCD34D}

/* SCORE BUTTONS */
.scores{display:flex;gap:5px;margin-top:8px}
.scores.lg{gap:8px;margin-top:0;justify-content:center}
.sb{font-family:var(--mono);width:38px;height:34px;border-radius:7px;cursor:pointer;font-weight:700;font-size:13px;border:1.5px solid var(--border);background:#FAFAFA;color:var(--dim);transition:all .15s ease}
.sb.lg{width:48px;height:44px;font-size:18px;border-radius:10px}
.sb.on{color:#fff;border-width:2.5px}
.s1.on{background:#DC2626;border-color:#DC2626;box-shadow:0 2px 8px #DC262633}
.s2.on{background:#EA580C;border-color:#EA580C;box-shadow:0 2px 8px #EA580C33}
.s3.on{background:#CA8A04;border-color:#CA8A04;box-shadow:0 2px 8px #CA8A0433}
.s4.on{background:#16A34A;border-color:#16A34A;box-shadow:0 2px 8px #16A34A33}
.s5.on{background:#059669;border-color:#059669;box-shadow:0 2px 8px #05966933}

/* LAYOUT */
.wrap{max-width:480px;margin:0 auto;min-height:100vh}
.hero{background:linear-gradient(150deg,var(--dark) 0%,var(--dark2) 55%,var(--dark) 100%);padding:32px 20px 28px;color:#fff;position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-50px;right:-30px;width:180px;height:180px;border-radius:50%;background:radial-gradient(circle,#FF4B1F22 0%,transparent 70%)}
.hero::after{content:'';position:absolute;bottom:-60px;left:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,#FF906822 0%,transparent 70%)}
.hero>div{position:relative}
.logo{width:36px;height:36px;border-radius:9px;background:linear-gradient(135deg,var(--fire),var(--fire2));display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:900;color:#fff;box-shadow:0 4px 12px rgba(255,75,31,.35)}
.body{padding:16px 18px 40px}
.label{display:block;font-size:10px;font-weight:700;color:#6B7280;margin-bottom:5px;letter-spacing:.08em;text-transform:uppercase}
.inp{width:100%;padding:11px 13px;border-radius:9px;border:1.5px solid var(--border);font-size:14px;background:var(--card)}

/* TOGGLE */
.toggle-wrap{width:100%;margin-top:14px;padding:12px 14px;border-radius:10px;cursor:pointer;display:flex;align-items:center;gap:10;border:1.5px solid var(--border);background:var(--card);transition:all .2s ease}
.toggle-wrap.on{border:2px solid #818CF8;background:linear-gradient(135deg,var(--indigobg),#E0E7FF)}
.toggle-track{width:44px;height:24px;border-radius:12px;padding:2px;background:#D1D5DB;display:flex;align-items:center;transition:background .2s;flex-shrink:0}
.toggle-wrap.on .toggle-track{background:#818CF8}
.toggle-knob{width:20px;height:20px;border-radius:10px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.15);transition:transform .2s}
.toggle-wrap.on .toggle-knob{transform:translateX(20px)}

/* CARDS */
.cl-card{display:flex;align-items:center;gap:12px;width:100%;padding:14px 16px;margin-bottom:8px;border-radius:12px;cursor:pointer;text-align:left;border:1.5px solid var(--border);background:var(--card);transition:all .2s}
.cl-card.done{border-color:var(--greenbd);background:#F0FDF4}

/* PHASE */
.phase{margin-bottom:10px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--card)}
.phase.complete{border:1.5px solid var(--greenbd)}
.phase.watch-zone{border-color:var(--indigobd)}
.phase-hdr{width:100%;padding:11px 14px;display:flex;justify-content:space-between;align-items:center;border:none;cursor:pointer;font-family:var(--sans);background:#FAFAFA}
.phase.complete .phase-hdr{background:#F0FDF4}
.phase.watch-zone .phase-hdr{background:var(--purplebg)}
.phase-body{padding:6px 14px 10px}
.item{padding:10px 0;border-bottom:1px solid #F5F5F5}
.item:last-child{border-bottom:none}

/* GPS */
.gps{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:10px;width:100%;text-align:left;cursor:pointer;border:2px dashed var(--border);background:var(--card)}
.gps.on{border:1.5px solid var(--green);background:var(--greenbg)}

/* WATCH PHASE */
.wphase{margin-bottom:10px;border-radius:12px;overflow:hidden;border:1px solid var(--border);background:var(--card)}
.wphase.scored{border:1.5px solid var(--greenbd)}
.wphase-hdr{padding:12px 14px;display:flex;align-items:center;gap:10px;background:#FAFAFA;border-bottom:1px solid #F3F4F6}
.wphase.scored .wphase-hdr{background:#F0FDF4}
.wphase-body{padding:14px}

/* HANDOFF */
.handoff{margin:16px 0;padding:14px 16px;border-radius:12px;background:linear-gradient(135deg,var(--indigobg),#E0E7FF);border:2px solid var(--indigobd);display:flex;align-items:center;gap:12px}

/* NAV */
.nav{position:sticky;top:0;z-index:100;padding:12px 16px 10px;border-bottom:1px solid}
.nav-dark{background:var(--dark);border-color:var(--dark2)}
.nav-indigo{background:#1E1B4B;border-color:#312E81}
.pbar{margin-top:8px;height:3px;border-radius:2px}
.pfill{height:100%;border-radius:2px;transition:width .4s cubic-bezier(.34,1.56,.64,1)}

/* PHOTO / NOTE */
.photo-btn{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;font-size:11px;border-radius:6px;cursor:pointer;font-weight:600;border:1.5px dashed var(--border);background:var(--card);color:var(--dim)}
.photo-btn.on{border:1.5px solid var(--green);background:var(--greenbg);color:var(--green)}
.note-btn{margin-top:4px;padding:2px 8px;font-size:10.5px;color:var(--dim);background:none;border:1px dashed #D1D5DB;border-radius:4px;cursor:pointer}
.note-area{margin-top:6px;width:100%;padding:8px 10px;font-size:12.5px;border:1.5px solid var(--border);border-radius:7px;resize:vertical;line-height:1.5;color:var(--text);background:#FAFAFA}
.memo-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:11.5px;font-weight:600;border:1.5px dashed var(--border);background:var(--card);color:#6B7280}
.memo-btn.on{border:1.5px solid var(--green);background:var(--greenbg);color:var(--green)}

/* SUBMIT */
.submit-btn{width:100%;padding:15px;border-radius:12px;border:none;font-size:15px;font-weight:800;cursor:pointer;transition:all .2s}
.submit-on{background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;box-shadow:0 6px 20px rgba(255,75,31,.25)}
.submit-off{background:#E5E7EB;color:var(--dim);cursor:default}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:1000;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;border-radius:16px 16px 0 0;max-width:480px;width:100%;max-height:85vh;overflow:auto;padding:20px 18px 28px}

/* PILLAR DASH */
.pdash{margin:12px 0;padding:16px;border-radius:12px;background:linear-gradient(145deg,#0F172A 0%,#1E293B 60%,#0F172A 100%);color:#fff}
.pcell{padding:12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.pbar-inner{height:3px;border-radius:2px;background:#1E293B;margin-top:6px}

/* PROTOCOL */
.protocol{margin-top:16px;padding:12px 14px;border-radius:10px;background:#FFFBEB;border:1px solid #FDE68A;font-size:11.5px;color:#92400E;line-height:1.6}

/* LEGEND */
.legend{margin:8px 0;padding:12px;border-radius:10px;background:#F9FAFB;border:1px solid var(--border)}
.legend-row{display:flex;gap:8px;align-items:center;margin-bottom:4px}
.legend-dot{width:22px;height:22px;border-radius:5px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;font-family:var(--mono);flex-shrink:0}

.tag{background:#F3F4F6;padding:3px 8px;border-radius:4px;font-size:11px;color:#6B7280}
.section-label{display:flex;align-items:center;gap:6px;margin-bottom:8px;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.haptic{display:inline-block;width:6px;height:6px;border-radius:50%;background:#818CF8;animation:pu 2s infinite}
.watch-tag{font-family:var(--mono);font-size:9px;padding:1px 6px;border-radius:3px;background:#818CF820;color:var(--indigo2);font-weight:600;border:1px solid var(--indigobd)}
.watch-tag-sm{font-family:var(--mono);font-size:8px;padding:1px 5px;border-radius:3px;background:#EDE9FE;color:var(--purple);font-weight:600}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
// ═══════ DATA ═══════
const P={O:{l:"OPS",c:"#0D9488"},S:{l:"SAFE",c:"#DC2626"},G:{l:"GUEST",c:"#2563EB"},F:{l:"FACIL",c:"#B45309"}};
const AN=[{n:1,l:"Critical",d:"Safety hazard or total failure",c:"#DC2626"},{n:2,l:"Poor",d:"Below minimum standard",c:"#EA580C"},{n:3,l:"Acceptable",d:"Meets baseline expectations",c:"#CA8A04"},{n:4,l:"Good",d:"Above average",c:"#16A34A"},{n:5,l:"Excellent",d:"Best-in-class",c:"#059669"}];

const CL=[
{id:"rc",title:"Roller Coasters",icon:"\u{1F3A2}",desc:"Steel & wood coasters",phases:[
{n:"Approach",ph:1,items:[{t:"Ride signage visible and legible from 50+ ft",p:"G"},{t:"Height requirement posted clearly at approach",p:"S"},{t:"Wait time posted and appears accurate",p:"O"},{t:"Pathway to entrance clear, ADA-accessible",p:"F"}]},
{n:"Queue Entry",w:1,items:[{t:"Ride rules and restrictions posted at queue entrance",p:"S"},{t:"Loose article policy clearly communicated",p:"G"},{t:"Entry point staffed or monitored",p:"O"},{t:"Queue entrance area clean and maintained",p:"F"}]},
{n:"Queue Experience",w:1,items:[{t:"Queue moves at consistent pace — no unexplained stops >3 min",p:"O"},{t:"Shade, fans, or misting available in outdoor sections",p:"G"},{t:"Railings and barriers secure, no sharp edges",p:"S"},{t:"Queue area free of trash, graffiti, standing water",p:"F"}]},
{n:"Station / Loading",w:1,ph:1,items:[{t:"Grouper efficiently assigns rows, minimizes empty seats",p:"O"},{t:"Operator restraint checks thorough (belt + bar, every guest)",p:"S"},{t:"Verbal safety spiel delivered clearly before dispatch",p:"S"},{t:"Operator engages guests positively — not robotic",p:"G"},{t:"Station platform clean, non-slip surface intact",p:"F"}]},
{n:"Dispatch",w:1,items:[{t:"All-clear procedure visible (thumbs-up, call-out, panel check)",p:"S"},{t:"Dispatch interval consistent — no excessive stacking",p:"O"},{t:"Gates and airgates function properly",p:"F"}]},
{n:"Ride",w:1,items:[{t:"Ride operates smoothly — no abnormal sounds or jolts",p:"S"},{t:"On-ride theming and effects functioning",p:"G"},{t:"Track/structure visible portions well-maintained",p:"F"}]},
{n:"Unload",w:1,items:[{t:"Operator confirms full stop before releasing restraints",p:"S"},{t:"Clear directional signage for exit",p:"G"},{t:"Operator thanks guests or provides positive send-off",p:"G"},{t:"Unload platform clean and dry",p:"F"}]},
{n:"Exit",ph:1,items:[{t:"Exit path clearly marked — no dead-ends",p:"G"},{t:"On-ride photo/retail does not block egress",p:"S"},{t:"Exit area clean and maintained",p:"F"},{t:"Re-ride option clearly signed (if offered)",p:"O"}]}
]},
{id:"fr",title:"Flat Rides",icon:"\u{1F3A1}",desc:"Spinning, swinging & tower rides",phases:[
{n:"Approach",ph:1,items:[{t:"Ride name and type identifiable from pathway",p:"G"},{t:"Height/weight/health restrictions posted",p:"S"},{t:"Wait time display present and current",p:"O"},{t:"Approach path clear and well-maintained",p:"F"}]},
{n:"Queue Entry",w:1,items:[{t:"Safety rules and rider responsibility signage posted",p:"S"},{t:"Loose article storage bins or lockers visible",p:"G"},{t:"Queue entry staffed — line-jumping controlled",p:"O"},{t:"Entry infrastructure in good repair",p:"F"}]},
{n:"Queue Experience",w:1,items:[{t:"Queue flow managed — no bottlenecks",p:"O"},{t:"Guest comfort measures in place (shade, seating)",p:"G"},{t:"Barriers intact — no climbable hazards",p:"S"},{t:"Queue surface level, clean, no trip hazards",p:"F"}]},
{n:"Station / Loading",w:1,ph:1,items:[{t:"Operator seats guests efficiently — balanced loading",p:"O"},{t:"Restraint check performed individually on every guest",p:"S"},{t:"Operator delivers safety instructions audibly",p:"S"},{t:"Operator friendly — attentive to children/nervous riders",p:"G"},{t:"Loading area surface and seating units clean",p:"F"}]},
{n:"Dispatch",w:1,items:[{t:"Clear verbal or visual all-clear before start",p:"S"},{t:"Cycle time consistent with posted duration",p:"O"},{t:"Control panel area organized — operator focused",p:"O"}]},
{n:"Ride",w:1,items:[{t:"Ride operates within expected motion envelope",p:"S"},{t:"Lighting/music/effects functioning",p:"G"},{t:"Visible mechanical components appear maintained",p:"F"}]},
{n:"Unload",w:1,items:[{t:"Full stop confirmed before restraint release",p:"S"},{t:"Exit direction clearly communicated",p:"G"},{t:"Operator assists guests needing help exiting",p:"G"},{t:"Unload zone clean — free of debris",p:"F"}]},
{n:"Exit",ph:1,items:[{t:"Exit path intuitive — reconnects to main pathway",p:"G"},{t:"No pinch points or crowd conflicts at exit",p:"S"},{t:"Exit area well-lit and maintained",p:"F"},{t:"Staff visible if guest needs post-ride assistance",p:"O"}]}
]},
{id:"wr",title:"Water Rides / Slides",icon:"\u{1F30A}",desc:"Flumes, slides & water coasters",phases:[
{n:"Approach",ph:1,items:[{t:"Ride/slide name and type visible from approach",p:"G"},{t:"Height/weight/swimming requirements posted",p:"S"},{t:"Wait time or queue status communicated",p:"O"},{t:"Pathway slip-resistant — properly graded",p:"F"}]},
{n:"Queue Entry",w:1,items:[{t:"Rider rules posted (body position, tube req, no running)",p:"S"},{t:"Tube/raft distribution organized",p:"O"},{t:"Footwear policy and storage communicated",p:"G"},{t:"Queue entry surface non-slip — no standing water",p:"F"}]},
{n:"Queue Experience",w:1,items:[{t:"Queue flows steadily — staff manage merging lines",p:"O"},{t:"Sun protection on stairways/elevated sections",p:"G"},{t:"Stairways have handrails, non-slip treads, no broken steps",p:"S"},{t:"Queue areas clean — no mildew/algae",p:"F"}]},
{n:"Launch / Loading",w:1,ph:1,items:[{t:"Attendant verifies rider positioning and tube seating",p:"S"},{t:"Dispatch timing controlled — no premature sends",p:"S"},{t:"Operator gives clear ride instructions",p:"O"},{t:"Operator engaging — reassuring with first-timers",p:"G"},{t:"Launch area surface maintained — adequate drainage",p:"F"}]},
{n:"Dispatch",w:1,items:[{t:"Spacing between riders controlled (visual/timer)",p:"S"},{t:"Water flow consistent and appropriate",p:"O"},{t:"Communication between top and bottom functional",p:"O"}]},
{n:"Ride",w:1,items:[{t:"Slide/flume surface smooth — no exposed joints",p:"S"},{t:"Water flow adequate throughout ride path",p:"O"},{t:"Theming/lighting functioning in enclosed sections",p:"G"},{t:"Visible structure in good condition — no rust",p:"F"}]},
{n:"Splash Zone / Landing",w:1,items:[{t:"Catch pool adequately deep — attendant present",p:"S"},{t:"Clear exit direction from landing area",p:"G"},{t:"Tube return process organized",p:"O"},{t:"Landing pool water clear — surface intact",p:"F"}]},
{n:"Exit",ph:1,items:[{t:"Exit path non-slip — clearly marked",p:"G"},{t:"No cross-traffic between exiting and approaching guests",p:"S"},{t:"Exit surfaces clean — drainage working",p:"F"},{t:"Staff positioned to assist at exit",p:"O"}]}
]},
{id:"la",title:"Lifeguarded Attractions",icon:"\u{1F3CA}",desc:"Wave pools, lazy rivers, swim areas",phases:[
{n:"Approach",ph:1,items:[{t:"Attraction type and rules visible from approach",p:"G"},{t:"Capacity limits or entry restrictions posted",p:"S"},{t:"Current status (open/closed/capacity) displayed",p:"O"},{t:"Approach deck in good condition — non-slip",p:"F"}]},
{n:"Entry",items:[{t:"Entry point controlled — wristband/height check enforced",p:"S"},{t:"Life jacket availability and policy communicated",p:"S"},{t:"Rules signage comprehensive",p:"G"},{t:"Entry area clean — deck furniture organized",p:"F"}]},
{n:"Zone Observation",ph:1,items:[{t:"Water clarity — bottom visible in all areas",p:"S"},{t:"Depth markers clearly visible at all required points",p:"S"},{t:"Patron density within safe limits",p:"O"},{t:"Pool edges in good repair — no chipped tile",p:"F"},{t:"Wave/current intensity appropriate for posted age group",p:"G"}]},
{n:"Lifeguard Behavior",items:[{t:"Guards in elevated positions with unobstructed zone view",p:"S"},{t:"Guards performing active scanning (10/20 protocol)",p:"S"},{t:"No distractions — no phone use or side conversations",p:"O"},{t:"Rescue equipment within arm's reach",p:"S"},{t:"Guard rotation occurring at regular intervals",p:"O"}]},
{n:"Patron Management",items:[{t:"Rule violations addressed promptly",p:"S"},{t:"Corrections delivered professionally",p:"G"},{t:"Unattended children identified and guardian located",p:"S"},{t:"Capacity managed — guests informed if at limit",p:"O"}]},
{n:"Facility Condition",ph:1,items:[{t:"Deck surfaces non-slip — free of tripping hazards",p:"F"},{t:"Drain covers secure and compliant",p:"S"},{t:"Chemical smell not overpowering",p:"F"},{t:"Restrooms/changing areas nearby and accessible",p:"G"},{t:"First aid/emergency equipment visibly accessible",p:"S"}]},
{n:"Exit",items:[{t:"Exit path clearly defined — non-slip",p:"G"},{t:"Towel/dry-off area available",p:"G"},{t:"Exit no cross-traffic with active area",p:"S"},{t:"Exit area maintained — drains functioning",p:"F"}]}
]},
{id:"up",title:"Unmanned Play Structures",icon:"\u{1F6DD}",desc:"Playgrounds, splash pads, toddler areas",phases:[
{n:"Approach",ph:1,items:[{t:"Play area type and age range clearly posted",p:"G"},{t:"Rules and behavioral expectations posted",p:"S"},{t:"Operating hours and supervision notice visible",p:"O"},{t:"Approach surface even — ADA-accessible",p:"F"}]},
{n:"Entry",items:[{t:"Entry/exit points defined (not open from all sides)",p:"S"},{t:"Parent/guardian supervision requirement stated",p:"S"},{t:"Footwear policy communicated (if splash pad)",p:"G"},{t:"Entry surface transition safe — no abrupt level change",p:"F"}]},
{n:"Condition Assessment",ph:1,items:[{t:"All structure components intact — no broken rungs/cracked slides",p:"S"},{t:"Fall surfaces adequate and maintained",p:"S"},{t:"No exposed bolts, sharp edges, or pinch points at child height",p:"S"},{t:"Water features flowing clean — drains unblocked",p:"F"},{t:"Structure clean — no graffiti, gum, or contamination",p:"F"}]},
{n:"Supervision Environment",items:[{t:"Sightlines clear — parents can see entire play area",p:"G"},{t:"Shaded seating available for supervising adults",p:"G"},{t:"Perimeter prevents wandering into traffic/ride areas",p:"S"},{t:"Staff visible or call button/emergency contact posted",p:"O"}]},
{n:"Patron Behavior",items:[{t:"Age mixing manageable — older children not creating hazards",p:"S"},{t:"No overcrowding on individual elements",p:"O"},{t:"Parents/guardians engaged (not absent)",p:"G"},{t:"General atmosphere safe for target age group",p:"G"}]},
{n:"Exit",ph:1,items:[{t:"Exit reconnects safely to main pathway",p:"G"},{t:"No hazardous transition (wet area to hard pavement)",p:"S"},{t:"Trash receptacles available at exit",p:"F"},{t:"Hand-washing or sanitizing station nearby",p:"F"}]}
]}
];

// ═══════ STATE ═══════
let view='home',activeCL=null,meta={park:'',auditor:'',watchMode:false};
let allScores={},allNotes={},allPhotos={},allWS={},allWM={},expanded={},showLeg=false;

function sc(id){return allScores[id]||{}}
function nt(id){return allNotes[id]||{}}
function ph(id){return allPhotos[id]||{}}
function ws(id){return allWS[id]||{}}
function wm(id){return allWM[id]||{}}

function setScore(clId,k,v){if(!allScores[clId])allScores[clId]={};allScores[clId][k]=v;render();}
function setNote(clId,k,v){if(!allNotes[clId])allNotes[clId]={};allNotes[clId][k]=v;}
function setPhoto(clId,k,v){if(!allPhotos[clId])allPhotos[clId]={};allPhotos[clId][k]=v;render();}
function setWS(clId,k,v){if(!allWS[clId])allWS[clId]={};allWS[clId][k]=v;render();}
function setWM(clId,k,v){if(!allWM[clId])allWM[clId]={};allWM[clId][k]=v;render();}

function captGPS(field){
  const now=new Date();
  const ts=now.toLocaleString('en-US',{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  meta[field+'Time']=ts+' · GPS pending';render();
  if(navigator.geolocation){navigator.geolocation.getCurrentPosition(pos=>{meta[field+'Time']=ts+' · '+pos.coords.latitude.toFixed(4)+'°, '+pos.coords.longitude.toFixed(4)+'°';render();},()=>{meta[field+'Time']=ts+' · GPS unavailable';render();},{timeout:5000});}
}

// ═══════ HELPERS ═══════
function bdg(p,md){return`<span class="bdg ${md?'bdg-md':''} bdg-${p}">${P[p].l}</span>`;}
function scoreBtns(clId,key,lg){
  return`<div class="scores${lg?' lg':''}">${AN.map(a=>`<button class="sb s${a.n}${lg?' lg':''} ${(sc(clId)[key]===a.n)?'on':''}" title="${a.l}: ${a.d}" onclick="setScore('${clId}','${key}',${sc(clId)[key]===a.n?'null':a.n})">${a.n}</button>`).join('')}</div>`;
}
function gpsBlock(label,field,icon){
  const v=meta[field+'Time'];
  return`<button class="gps${v?' on':''}" onclick="captGPS('${field}')"><span style="font-size:20px">${v?'📍':icon}</span><div style="flex:1"><div style="font-size:11.5px;font-weight:700;color:${v?'var(--green)':'#6B7280'}">${label}</div><div class="mono" style="font-size:10.5px;color:${v?'#065F46':'var(--dim)'};margin-top:1px">${v||'Tap to capture GPS + timestamp'}</div></div></button>`;
}
function noteField(clId,key){
  const v=nt(clId)[key];
  if(v)return`<textarea class="note-area" onchange="setNote('${clId}','${key}',this.value)" rows="2">${v}</textarea>`;
  return`<button class="note-btn" onclick="this.outerHTML='<textarea class=\\'note-area\\' onchange=\\'setNote(\\\"${clId}\\\",\\\"${key}\\\",this.value)\\' rows=\\'2\\' placeholder=\\'Observation note…\\'></textarea>'">+ note</button>`;
}
function photoBtn(clId,idx){
  const on=ph(clId)[idx];
  return`<button class="photo-btn${on?' on':''}" onclick="setPhoto('${clId}',${idx},${on?'false':'true'})">${on?'✓ 📷 Photo captured':'📷 Add photo'} <span style="font-size:9px;color:var(--dim);font-weight:400">· required</span></button>`;
}
function counted(clId,phases){
  const s=sc(clId);let total=0,scored=0;
  phases.forEach((p,pi)=>{p.items.forEach((_,ii)=>{total++;if(s[pi+'-'+ii]!=null)scored++;});});
  return{total,scored,pct:total?Math.round(scored/total*100):0};
}

// ═══════ RENDER ═══════
function render(){
  const app=document.getElementById('app');
  if(view==='home')app.innerHTML=renderHome();
  else if(view==='audit-watch')app.innerHTML=renderWatch();
  else if(view==='audit-detail')app.innerHTML=renderDetail();
}

function renderHome(){
  let h=`<div class="hero"><div><div style="display:flex;align-items:center;gap:10px;margin-bottom:6px"><div class="logo">AR</div><span style="font-size:22px;font-weight:800;letter-spacing:-.02em">AmusementRating</span></div><p style="font-size:13.5px;color:#94A3B8">Guest Journey Audit Checklists</p><p style="font-size:11px;color:#475569;margin-top:4px">5 checklists · 4 pillars · Watch handoff</p></div></div>`;
  h+=`<div class="body">`;
  h+=`<div><span class="label">Park Name</span><input class="inp" value="${meta.park}" placeholder="e.g. Six Flags Great Adventure" onchange="meta.park=this.value"></div>`;
  h+=`<div style="margin-top:10px"><span class="label">Auditor</span><input class="inp" value="${meta.auditor}" placeholder="Your name" onchange="meta.auditor=this.value"></div>`;

  // Watch toggle
  h+=`<div class="toggle-wrap${meta.watchMode?' on':''}" onclick="meta.watchMode=!meta.watchMode;render()"><span style="font-size:22px">⌚</span><div style="flex:1;text-align:left"><div style="font-size:13.5px;font-weight:700;color:${meta.watchMode?'var(--indigo)':'var(--text)'}">Apple Watch Handoff Mode</div><div style="font-size:10.5px;color:${meta.watchMode?'var(--indigo2)':'var(--dim)'};margin-top:1px">${meta.watchMode?'ON — Phone-free phases scored on Watch':'OFF — Full phone scoring only'}</div></div><div class="toggle-track"><div class="toggle-knob"></div></div></div>`;
  if(meta.watchMode)h+=`<div style="margin:8px 0 4px;padding:10px 12px;border-radius:8px;background:var(--purplebg);border:1px solid var(--purplebd);font-size:11px;color:#6D28D9;line-height:1.5"><strong>Watch workflow:</strong> Score Approach on phone → lock phone at queue → Watch captures phase-level scores + voice memos → phone resumes at Exit → backfill item detail</div>`;

  // Pillar key
  h+=`<div style="display:flex;gap:6px;padding:10px 12px;border-radius:9px;background:var(--card);border:1px solid var(--border);margin-top:12px;flex-wrap:wrap;align-items:center">${Object.keys(P).map(k=>bdg(k,1)).join('')}<span class="mono" style="font-size:10px;color:var(--dim);margin-left:auto">4 pillars</span></div>`;

  // Checklist cards
  h+=`<div style="margin-top:18px"><span class="label">Select Checklist</span><div style="margin-top:10px">`;
  CL.forEach(cl=>{
    const c=counted(cl.id,cl.phases);const dn=c.pct===100;const wpc=cl.phases.filter(p=>p.w).length;
    h+=`<button class="cl-card${dn?' done':''}" onclick="activeCL=CL.find(x=>x.id==='${cl.id}');view=meta.watchMode&&activeCL.phases.some(p=>p.w)?'audit-watch':'audit-detail';expanded={};render();window.scrollTo(0,0)"><span style="font-size:30px;width:42px;text-align:center">${cl.icon}</span><div style="flex:1"><div style="font-size:15px;font-weight:700;color:#111827">${cl.title}</div><div style="font-size:11px;color:var(--dim);margin-top:2px">${cl.phases.length} phases · ${c.total} items${meta.watchMode&&wpc?` <span style="color:#818CF8">· ⌚ ${wpc} watch</span>`:''}</div></div><div style="text-align:right;min-width:42px">${c.scored>0?`<div class="mono" style="font-size:17px;font-weight:800;color:${dn?'#16A34A':'var(--fire)'}">${c.pct}%</div><div class="mono" style="font-size:9.5px;color:var(--dim)">${c.scored}/${c.total}</div>`:'<span style="font-size:20px;color:#D1D5DB">›</span>'}</div></button>`;
  });
  h+=`</div></div>`;
  h+=`<div class="protocol"><strong>Auditor Protocol:</strong> Walk each attraction as a guest. ${meta.watchMode?'Use Watch for phone-free queue/ride phases. Backfill item detail on phone after exit.':'Score items in real-time.'} Target 5–8 minutes per checklist.</div>`;
  h+=`</div>`;
  return h;
}

function renderPhaseDetail(cl,phaseIdx,phase){
  const clId=cl.id;const s=sc(clId);
  const done=phase.items.filter((_,i)=>s[phaseIdx+'-'+i]!=null).length;
  const comp=done===phase.items.length;const isExp=expanded[phaseIdx]!==false;
  const wsVal=ws(clId)[phaseIdx];

  let h=`<div class="phase${comp?' complete':''}${phase.w?' watch-zone':''}">`;
  h+=`<button class="phase-hdr" onclick="expanded[${phaseIdx}]=${isExp?'false':'true'};render()"><div style="display:flex;align-items:center;gap:8px;text-align:left"><span style="font-size:11px;color:var(--dim);transition:transform .2s;transform:rotate(${isExp?'0':'-90'}deg)">▾</span>${comp?'<span style="font-size:13px">✓</span>':''}<span style="font-weight:700;font-size:13.5px;color:#111827">${phase.n}</span>${phase.w?`<span class="watch-tag-sm">⌚ ${wsVal||'—'}</span>`:''}${phase.ph?'<span style="font-size:10px">📷</span>':''}</div><span class="mono" style="font-size:11px;font-weight:600;color:${comp?'#16A34A':'var(--dim)'}">${done}/${phase.items.length}</span></button>`;

  if(isExp){
    h+=`<div class="phase-body">`;
    if(phase.w&&wsVal)h+=`<div style="padding:8px 10px;margin-bottom:8px;border-radius:8px;background:var(--purplebg);border:1px solid var(--purplebd);font-size:11px;color:var(--purple)">⌚ Watch scored <strong>${wsVal}/5</strong> — now add item detail</div>`;
    phase.items.forEach((item,i)=>{
      const k=phaseIdx+'-'+i;
      h+=`<div class="item"><div style="display:flex;gap:8px;align-items:flex-start">${bdg(item.p)}<span style="font-size:12.5px;color:var(--text);line-height:1.55;flex:1">${item.t}</span></div>${scoreBtns(clId,k)}${noteField(clId,k)}</div>`;
    });
    if(phase.ph)h+=`<div style="margin-top:8px;padding-top:8px;border-top:1px solid #F3F4F6">${photoBtn(clId,phaseIdx)}</div>`;
    h+=`</div>`;
  }
  h+=`</div>`;
  return h;
}

function renderWatchPhase(cl,phaseIdx,phase){
  const clId=cl.id;const wsVal=ws(clId)[phaseIdx];const wmVal=wm(clId)[phaseIdx];
  let h=`<div class="wphase${wsVal!=null?' scored':''}">`;
  h+=`<div class="wphase-hdr"><span style="font-size:16px">⌚</span><div style="flex:1"><div style="font-weight:700;font-size:13.5px;color:#111827;display:flex;align-items:center;gap:6px">${phase.n} <span class="watch-tag">WATCH</span></div><div style="font-size:10.5px;color:var(--dim);margin-top:1px">${phase.items.length} items · Phase-level score</div></div></div>`;
  h+=`<div class="wphase-body"><div style="text-align:center;margin-bottom:8px"><div style="font-size:11px;font-weight:600;color:#6B7280;margin-bottom:8px">Overall phase score</div>${scoreBtns(clId,'w'+phaseIdx,1).replace(/setScore/g,'setWS')}</div>`;
  h+=`<div style="margin-top:12px"><button class="memo-btn${wmVal?' on':''}" onclick="setWM('${clId}',${phaseIdx},${wmVal?"''":"'recorded'"})">🎙 ${wmVal?'Memo captured':'Voice memo (Siri)'}</button></div>`;
  h+=`<div style="margin-top:8px;display:flex;align-items:center;gap:6px;font-size:10px;color:var(--dim)"><span class="haptic"></span>Haptic tap at phase transition</div>`;
  h+=`</div></div>`;
  return h;
}

function renderPillarDash(cl){
  const s=sc(cl.id);const pd={O:[],S:[],G:[],F:[]};
  cl.phases.forEach((p,pi)=>p.items.forEach((it,ii)=>{const v=s[pi+'-'+ii];if(v!=null)pd[it.p].push(v)}));
  const c=counted(cl.id,cl.phases);
  let h=`<div class="pdash"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><span style="font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#94A3B8">Pillar Scores</span><span class="mono" style="font-size:11px;color:#64748B">${c.scored}/${c.total}</span></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">`;
  Object.entries(pd).forEach(([code,arr])=>{
    const avg=arr.length?arr.reduce((a,b)=>a+b,0)/arr.length:0;
    const pt=cl.phases.reduce((s,p)=>s+p.items.filter(i=>i.p===code).length,0);
    const bc=avg>=4?'#059669':avg>=3?'#CA8A04':avg>0?'#DC2626':'#334155';
    h+=`<div class="pcell"><div style="display:flex;justify-content:space-between"><span class="mono" style="font-size:10px;font-weight:700;color:#94A3B8;letter-spacing:.08em">${P[code].l}</span><span class="mono" style="font-size:9px;color:#475569">${arr.length}/${pt}</span></div><div class="mono" style="font-size:26px;font-weight:800;color:${arr.length?'#F8FAFC':'#334155'};margin-top:2px;line-height:1.1">${arr.length?avg.toFixed(1):'—'}</div><div class="pbar-inner"><div style="height:3px;border-radius:2px;width:${avg*20}%;background:${bc};transition:width .4s ease"></div></div></div>`;
  });
  h+=`</div></div>`;return h;
}

function renderNav(cl,mode){
  const c=counted(cl.id,cl.phases);const isW=mode==='watch';
  const wsd=Object.values(ws(cl.id)).filter(v=>v!=null).length;
  const twp=cl.phases.filter(p=>p.w).length;
  let h=`<div class="nav ${isW?'nav-indigo':'nav-dark'}"><div style="display:flex;align-items:center;gap:10px"><button onclick="view=${isW?"'home'":meta.watchMode&&cl.phases.some(p=>p.w)?"'audit-watch'":"'home'"};render();window.scrollTo(0,0)" style="background:none;border:none;color:${isW?'#A5B4FC':'#94A3B8'};font-size:20px;cursor:pointer;padding:0">←</button><span style="font-size:20px">${cl.icon}</span><div style="flex:1"><div style="display:flex;align-items:center;gap:6px"><span style="font-size:14.5px;font-weight:700;color:#F8FAFC">${cl.title}</span>${isW?'<span class="watch-tag">⌚ WATCH</span>':'<span class="mono" style="font-size:9px;padding:2px 6px;border-radius:4px;background:#ffffff15;color:#94A3B8;font-weight:600">DETAIL</span>'}</div><div style="font-size:10.5px;color:${isW?'var(--indigo2)':'#64748B'};margin-top:1px">${isW?wsd+'/'+twp+' watch phases scored':cl.phases.length+' phases · '+c.total+' observations'}</div></div>${!isW?`<span class="mono" style="font-size:14px;font-weight:800;color:${c.pct===100?'#86EFAC':'var(--fire2)'}">${c.pct}%</span>`:''}</div>`;
  if(isW){h+=`<div class="pbar" style="background:#312E81"><div class="pfill" style="width:${twp?wsd/twp*100:0}%;background:linear-gradient(90deg,#818CF8,#A78BFA)"></div></div>`;}
  else{h+=`<div class="pbar" style="background:var(--dark2)"><div class="pfill" style="width:${c.pct}%;background:${c.pct===100?'#16A34A':'linear-gradient(90deg,var(--fire),var(--fire2))'}"></div></div>`;}
  h+=`</div>`;return h;
}

function renderTags(){
  let h='<div style="display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:#6B7280;margin-bottom:12px">';
  if(meta.park)h+=`<span class="tag">📍 ${meta.park}</span>`;
  if(meta.auditor)h+=`<span class="tag">👤 ${meta.auditor}</span>`;
  h+='</div>';return h;
}

function renderWatch(){
  const cl=activeCL;const phases=cl.phases.map((p,i)=>({...p,idx:i}));
  const pre=phases.filter(p=>!p.w&&phases.indexOf(p)<phases.findIndex(x=>x.w));
  const wz=phases.filter(p=>p.w);
  const post=phases.filter(p=>!p.w&&phases.indexOf(p)>=phases.findIndex(x=>x.w)+wz.length);

  let h=renderNav(cl,'watch');
  h+=`<div class="body">${renderTags()}`;
  h+=gpsBlock('START — GPS + Timestamp','start','🟢');

  if(pre.length){
    h+=`<div style="margin-top:14px"><div class="section-label"><span style="font-size:14px">📱</span><span style="color:var(--text)">Phone Zone</span></div>`;
    pre.forEach(p=>{h+=renderPhaseDetail(cl,p.idx,p);});
    h+=`</div>`;
  }

  h+=`<div class="handoff"><div style="font-size:28px">📱→⌚</div><div><div style="font-size:13px;font-weight:800;color:var(--indigo)">Phone → Watch Handoff</div><div style="font-size:11px;color:var(--indigo2);margin-top:2px;line-height:1.4">Lock phone in locker. Watch captures phase scores + voice memos.</div></div></div>`;

  h+=`<div style="margin-bottom:14px"><div class="section-label"><span style="font-size:14px">⌚</span><span style="color:var(--indigo)">Watch Zone — Phase Scoring</span></div>`;
  wz.forEach(p=>{h+=renderWatchPhase(cl,p.idx,p);});
  h+=`</div>`;

  h+=`<div class="handoff"><div style="font-size:28px">⌚→📱</div><div><div style="font-size:13px;font-weight:800;color:var(--indigo)">Watch → Phone Sync</div><div style="font-size:11px;color:var(--indigo2);margin-top:2px;line-height:1.4">Retrieve phone. Watch scores sync automatically.</div></div></div>`;

  if(post.length){
    h+=`<div><div class="section-label"><span style="font-size:14px">📱</span><span style="color:var(--text)">Phone Zone</span></div>`;
    post.forEach(p=>{h+=renderPhaseDetail(cl,p.idx,p);});
    h+=`</div>`;
  }

  h+=`<div style="margin-top:10px">${gpsBlock('END — GPS + Timestamp','end','🔴')}</div>`;
  h+=`<button onclick="view='audit-detail';expanded={};render();window.scrollTo(0,0)" style="width:100%;margin-top:14px;padding:13px;border-radius:10px;border:1.5px solid var(--indigobd);background:var(--indigobg);color:var(--indigo);font-size:13px;font-weight:700;cursor:pointer">📱 Switch to Full Detail Mode</button>`;
  h+=`<button class="submit-btn submit-on" style="margin-top:8px" onclick="showSubmit()">Review & Submit</button>`;
  h+=`</div>`;
  return h;
}

function renderDetail(){
  const cl=activeCL;const c=counted(cl.id,cl.phases);
  let h=renderNav(cl,'detail');
  h+=`<div class="body">${renderTags()}`;
  h+=gpsBlock('START — GPS + Timestamp','start','🟢');

  // Legend toggle
  h+=`<button onclick="showLeg=!showLeg;render()" style="padding:5px 10px;font-size:11px;border:1px solid var(--border);border-radius:6px;background:var(--card);cursor:pointer;color:#6B7280;font-weight:600;margin-top:10px">${showLeg?'▾ Hide':'▸ Show'} score anchors</button>`;
  if(showLeg){
    h+=`<div class="legend">${AN.map(a=>`<div class="legend-row"><span class="legend-dot" style="background:${a.c}">${a.n}</span><span style="font-size:12px;color:var(--text)"><strong>${a.l}</strong> — ${a.d}</span></div>`).join('')}</div>`;
  }

  h+=renderPillarDash(cl);
  cl.phases.forEach((phase,i)=>{h+=renderPhaseDetail(cl,i,phase);});

  h+=`<div style="margin-top:10px">${gpsBlock('END — GPS + Timestamp','end','🔴')}</div>`;
  if(meta.watchMode&&cl.phases.some(p=>p.w)){
    h+=`<button onclick="view='audit-watch';expanded={};render();window.scrollTo(0,0)" style="width:100%;margin-top:14px;padding:13px;border-radius:10px;border:1.5px solid var(--indigobd);background:var(--indigobg);color:var(--indigo);font-size:13px;font-weight:700;cursor:pointer">⌚ Switch to Watch Capture Mode</button>`;
  }
  h+=`<button class="submit-btn ${c.scored>0?'submit-on':'submit-off'}" style="margin-top:8px" ${c.scored>0?'onclick="showSubmit()"':''}}>Review & Submit (${c.scored}/${c.total})</button>`;
  h+=`</div>`;
  return h;
}

function showSubmit(){
  const cl=activeCL;const s=sc(cl.id);const n=nt(cl.id);const w=ws(cl.id);const wm2=wm(cl.id);
  const payload={audit_id:'AR-'+cl.id.toUpperCase()+'-'+Date.now().toString(36).toUpperCase(),checklist_type:cl.title,park_name:meta.park||'(not set)',auditor:meta.auditor||'(not set)',capture_mode:meta.watchMode?'phone+watch':'phone-only',gps_start:meta.startTime||null,gps_end:meta.endTime||null,pillar_averages:{},watch_phase_scores:{},items:[]};
  const pv={O:[],S:[],G:[],F:[]};
  cl.phases.forEach((ph,pi)=>{
    if(w[pi]!=null)payload.watch_phase_scores[ph.n]={score:w[pi],voice_memo:!!wm2[pi]};
    ph.items.forEach((it,ii)=>{const k=pi+'-'+ii;const v=s[k];if(v!=null){payload.items.push({phase:ph.n,observation:it.t,pillar:it.p,score:v,note:n?.[k]||null,watch_zone:!!ph.w});pv[it.p].push(v);}});
  });
  Object.entries(pv).forEach(([p,arr])=>{payload.pillar_averages[p]=arr.length?+(arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(2):null;});

  const j=JSON.stringify(payload,null,2);
  const ov=document.createElement('div');ov.className='overlay';ov.onclick=e=>{if(e.target===ov)ov.remove();};
  ov.innerHTML=`<div class="modal"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div><h3 style="font-size:16px;font-weight:800">Submission Payload</h3><p style="font-size:11px;color:#6B7280;margin-top:2px">POST → Airtable API · ${meta.watchMode?'Phone + Watch':'Phone-only'}</p></div><button onclick="this.closest('.overlay').remove()" style="border:none;background:#F3F4F6;border-radius:8px;width:32px;height:32px;font-size:16px;cursor:pointer;color:#6B7280;display:flex;align-items:center;justify-content:center">✕</button></div><pre class="mono" style="background:#0F172A;color:#E2E8F0;padding:14px;border-radius:10px;font-size:10px;overflow:auto;white-space:pre-wrap;line-height:1.6;max-height:45vh">${j.replace(/</g,'&lt;')}</pre><div style="margin-top:14px;display:flex;gap:8px"><button onclick="navigator.clipboard.writeText(JSON.stringify(${JSON.stringify(payload)},null,2));this.textContent='✓ Copied';setTimeout(()=>this.textContent='Copy JSON',2000)" style="flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);font-weight:700;font-size:13px;cursor:pointer;color:var(--text)">Copy JSON</button><button style="flex:1;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--fire),var(--fire2));color:#fff;font-weight:800;font-size:13px;cursor:pointer;box-shadow:0 4px 14px rgba(255,75,31,.3)">Submit to Airtable</button></div></div>`;
  document.body.appendChild(ov);
}

// ═══════ INIT ═══════
render();
</script>
</body>
</html>
