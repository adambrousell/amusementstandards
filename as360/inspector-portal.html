<!DOCTYPE html>

<style>
:root{
  --bg:#0C0F14;--surface:#111520;--panel:#161C27;--panel2:#1C2333;--panel3:#222A3A;
  --border:#242D3E;--border2:#2E3A52;
  --teal:#0ABFBC;--teal-dim:rgba(10,191,188,.15);
  --red:#F43F5E;--red-dim:rgba(244,63,94,.15);
  --amber:#F59E0B;--amber-dim:rgba(245,158,11,.15);
  --green:#10B981;--green-dim:rgba(16,185,129,.15);
  --blue:#3B82F6;--blue-dim:rgba(59,130,246,.15);
  --purple:#8B5CF6;--purple-dim:rgba(139,92,246,.15);
  --text:#CBD5E1;--text-bright:#E8EDF5;--text-dim:#64748B;--text-muted:#3D4F6A;

  --accent:#6CA4DC;--accent-dim:rgba(108,164,220,.15);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);}
body{font-family:var(--sans);color:var(--text);display:flex;flex-direction:column;min-height:100vh;}
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:100;}
.tb-logo{display:flex;align-items:center;gap:8px;}
.tb-logo-mark{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),#0891B2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;font-family:var(--cond);}
.tb-brand{font-family:var(--cond);font-size:15px;font-weight:700;letter-spacing:.5px;color:var(--text-bright);}
.tb-divider{width:1px;height:20px;background:var(--border2);}
.tb-sub{font-family:var(--mono);font-size:10px;color:var(--purple);letter-spacing:1px;}
#at-sync{font-family:var(--mono);font-size:9px;color:var(--text-muted);letter-spacing:.5px;}
.main{flex:1;overflow-y:auto;padding:14px;max-width:640px;margin:0 auto;width:100%;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;}
.panel-hdr{padding:11px 14px;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.panel-title{font-family:var(--cond);font-size:14px;font-weight:700;color:var(--text-bright);}
.panel-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
.panel-body{padding:14px;}
.sec-label{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;margin-top:4px;}
.btn{padding:11px 18px;border:none;border-radius:8px;font-family:var(--cond);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:all .15s;min-height:44px;width:100%;text-align:center;}
.btn-accent{background:linear-gradient(135deg,var(--accent),#4A8BC4);color:#fff;}
.btn-purple{background:linear-gradient(135deg,var(--purple),#7C3AED);color:#fff;}
.btn-green{background:linear-gradient(135deg,var(--green),#059669);color:#fff;}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text-dim);}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5);}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:6px;min-height:36px;width:auto;}
.ff{margin-bottom:10px;}
.ff label{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);display:block;margin-bottom:5px;}
.ff input{width:100%;padding:10px 12px;background:var(--panel2);border:1px solid var(--border2);border-radius:7px;font-family:var(--sans);font-size:14px;color:var(--text);-webkit-appearance:none;transition:border-color .15s;min-height:44px;}
.ff input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
/* Login form override for password field */
.ff input[type="password"]{font-family:var(--sans);letter-spacing:2px;}
/* Checklist */
.form-progress{height:3px;background:var(--border);margin-bottom:14px;border-radius:2px;overflow:hidden;}
.form-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;}
.checklist-group{margin-bottom:14px;}
.cg-title{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.cg-row{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(36,45,62,.4);min-height:52px;}
.cg-row:last-child{border-bottom:none;}
.cg-row.disabled{opacity:.35;pointer-events:none;}
.cg-label{flex:1;font-size:13px;color:var(--text);font-weight:500;}
.cg-options{display:flex;gap:6px;flex-shrink:0;}
.cg-opt{padding:6px 7px;border-radius:5px;font-family:var(--mono);font-size:9px;font-weight:700;cursor:pointer;border:1px solid var(--border2);color:var(--text-dim);background:var(--panel3);transition:all .12s;min-width:32px;min-height:36px;display:flex;align-items:center;justify-content:center;}
.cg-opt.sel-1{background:var(--red-dim);border-color:rgba(244,63,94,.5);color:var(--red);}
.cg-opt.sel-2{background:rgba(244,63,94,.08);border-color:rgba(244,63,94,.3);color:#E8636F;}
.cg-opt.sel-3{background:var(--amber-dim);border-color:rgba(245,158,11,.4);color:var(--amber);}
.cg-opt.sel-4{background:rgba(16,185,129,.08);border-color:rgba(16,185,129,.3);color:#5CB89A;}
.cg-opt.sel-5{background:var(--green-dim);border-color:rgba(16,185,129,.5);color:var(--green);}
/* LOTO Gate */
.loto-gate{background:var(--panel2);border:2px solid var(--amber);border-radius:10px;padding:16px;margin-bottom:16px;text-align:center;}
.loto-gate .loto-icon{font-size:28px;margin-bottom:8px;}
.loto-gate .loto-text{font-family:var(--mono);font-size:11px;color:var(--amber);line-height:1.6;margin-bottom:12px;}
.loto-gate .loto-confirm-btn{background:linear-gradient(135deg,var(--amber),#D97706);color:#fff;border:none;border-radius:8px;padding:12px 24px;font-family:var(--cond);font-size:14px;font-weight:700;cursor:pointer;min-height:44px;}
.loto-gate.loto-confirmed{border-color:rgba(16,185,129,.4);background:var(--green-dim);}
/* Assignments */
.assign-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;transition:border-color .2s;}
.assign-card:hover{border-color:var(--purple);}
.assign-ride{font-family:var(--cond);font-size:15px;font-weight:700;color:var(--text-bright);}
.assign-meta{font-family:var(--mono);font-size:9px;color:var(--text-dim);margin-top:4px;}
.assign-due{font-family:var(--mono);font-size:9px;font-weight:700;}
.assign-due.overdue{color:var(--red);}
.assign-due.today{color:var(--amber);}
.assign-due.upcoming{color:var(--green);}
/* Toast */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-family:var(--mono);font-size:11px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.ok{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.toast.err{background:var(--red-dim);color:var(--red);border:1px solid rgba(244,63,94,.3);}
.toast.show{opacity:1;}
/* Screens */
.screen{display:none;}
.screen.active{display:block;}
</style>
</head>

// ── NAVIGATION ──
function showScreen(id){
  document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});
  var el=document.getElementById('screen-'+id);
  if(el)el.classList.add('active');
}

// ── LOGIN ──
async function doLogin(){
  var email=(document.getElementById('login-email').value||'').trim();
  var password=(document.getElementById('login-password').value||'').trim();
  var errEl=document.getElementById('login-error');
  errEl.textContent='';
  if(!email||!password){errEl.textContent='Enter email and password';return;}
  var btn=document.getElementById('login-btn');
  if(btn){btn.disabled=true;btn.textContent='Logging in...';}
  try{
    var filter=encodeURIComponent("AND({Email}='"+email+"',{Password}='"+password+"')");
    var res=await fetch(AT_URL+'/Inspector_Credentials?filterByFormula='+filter,{headers:{'Content-Type':'application/json'}});
    if(!res.ok)throw new Error('Network');
    var data=await res.json();
    if(data.records&&data.records.length>0){
      var r=data.records[0].fields;
      currentInspector={id:r.Inspector_ID||email,name:r.Name||r.Full_Name||email,recordId:data.records[0].id};
      demoMode=false;
      toast('Welcome, '+currentInspector.name,'ok');
      setTimeout(function(){loadAssignments();},300);
    }else{
      errEl.textContent='Invalid credentials';
      if(btn){btn.disabled=false;btn.textContent='Log In \u2192';}
    }
  }catch(e){
    // Demo fallback when proxy is unreachable
    var demoAccounts={'demo@masi.com':{pw:'masi2026',name:'Demo Inspector \u00b7 MASI Pilot',id:'DEMO-001'},'noel@masi.com':{pw:'inspect2026',name:'Noel Rhodes \u00b7 MASI Loss Control',id:'INS-0001'}};
    var account=demoAccounts[email.toLowerCase()];
    if(account&&password===account.pw){
      demoMode=true;
      currentInspector={id:account.id,name:account.name,recordId:'demo'};
      var badge=document.getElementById('login-demo-badge');
      if(badge)badge.style.display='block';
      var syncEl=document.getElementById('at-sync');
      if(syncEl){syncEl.style.color='var(--text-muted)';syncEl.textContent='Demo mode';}
      toast('Welcome, '+currentInspector.name,'ok');
      setTimeout(function(){loadAssignments();},300);
    }else{
      errEl.textContent='Invalid credentials';
      if(btn){btn.disabled=false;btn.textContent='Log In \u2192';}
    }
  }
}

function renderDemoAssignments(){
  var list=document.getElementById('assignments-list');
  var html='';
  DEMO_FACILITIES.forEach(function(fac){
    var badgeColor=fac.status==='due'?'var(--amber)':fac.status==='scheduled'?'var(--accent)':'var(--text-muted)';

    html+='<div class="panel" style="margin-bottom:12px;"><div class="panel-hdr"><div><div class="panel-title">'+fac.facility+'</div></div><span style="font-family:var(--mono);font-size:8px;font-weight:700;padding:3px 8px;border-radius:3px;background:'+badgeBg+';color:'+badgeColor+';border:1px solid '+badgeColor+';">'+badgeLabel+'</span></div>';
    html+='<div class="panel-body" style="padding:10px 14px;">';
    fac.rides.forEach(function(r){
      html+='<div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border);">';
      html+='<div style="font-family:var(--cond);font-size:14px;font-weight:600;color:var(--text-bright);">'+r.ride+'</div>';

      }
      html+='</div>';
    });
    html+='</div></div>';
  });
  list.innerHTML=html;
}

function openDemoRide(rideId,facId){
  var fac=DEMO_FACILITIES.find(function(f){return f.id===facId;});
  var ride=fac?fac.rides.find(function(r){return r.id===rideId;}):null;
  if(!fac||!ride)return;
  currentAssignment={id:rideId,facility:fac.facility,ride:ride.ride,type:ride.checklistKey,dueDate:fac.dueDate};
  renderChecklist();
}

  try{
    var filter=encodeURIComponent("{Inspector_ID}='"+currentInspector.id+"'");
    var res=await fetch(AT_URL+'/Inspector_Assignments?filterByFormula='+filter,{headers:{'Content-Type':'application/json'}});
    if(!res.ok)throw new Error('Network');
    var data=await res.json();
    if(!data.records||data.records.length===0){
      list.innerHTML='<div class="panel"><div class="panel-body" style="text-align:center;padding:32px;"><div style="font-size:28px;margin-bottom:8px;">&#x1F4CB;</div><div style="color:var(--text-dim);">No inspections assigned</div></div></div>';
      return;
    }
    var today=new Date().toISOString().split('T')[0];
    list.innerHTML=data.records.map(function(rec){
      var f=rec.fields;
      var due=f.Due_Date||'';
      var dueClass=due<today?'overdue':due===today?'today':'upcoming';
      var dueLabel=due<today?'OVERDUE':due===today?'DUE TODAY':'Due '+due;
      return '<div class="assign-card" onclick="openAssignment(\''+rec.id+'\')"><div style="display:flex;justify-content:space-between;align-items:center;"><div class="assign-ride">'+(f.Ride||'Ride')+'</div><span class="assign-due '+dueClass+'">'+dueLabel+'</span></div><div class="assign-meta">'+(f.Facility||'Facility')+' &#x2022; '+(f.Inspection_Type||'Inspection')+' &#x2022; '+(f.Ride||'')+'</div></div>';
    }).join('');
  }catch(e){
    list.innerHTML='<div class="panel"><div class="panel-body" style="text-align:center;color:var(--red);">Failed to load assignments</div></div>';
  }
}

// Store fetched assignment records
var assignmentRecords={};

async function openAssignment(recId){
  try{
    var res=await fetch(AT_URL+'/Inspector_Assignments/'+recId,{headers:{'Content-Type':'application/json'}});
    if(!res.ok)throw new Error('Network');
    var data=await res.json();
    var f=data.fields||data;
    currentAssignment={id:recId,facility:f.Facility||'',ride:f.Ride||'',type:f.Inspection_Type||'Annual Ride Inspection',dueDate:f.Due_Date||''};
    renderChecklist();
  }catch(e){
    toast('Failed to load assignment','err');
  }
}

// ── LOTO ──
function confirmLoto(){
  lotoConfirmed=true;
  lotoTimestamp=new Date().toISOString();
  var gate=document.getElementById('loto-gate');
  if(gate){gate.className='loto-gate loto-confirmed';gate.innerHTML='<div class="loto-icon">&#x2705;</div><div class="loto-text" style="color:var(--green);">LOTO CONFIRMED — '+new Date(lotoTimestamp).toLocaleTimeString()+'</div>';}
  document.querySelectorAll('.cg-row.disabled').forEach(function(r){r.classList.remove('disabled');});
  updateProgress();
}

// ── CHECKLIST RENDER ──
function renderChecklist(){
  answers={};
  sectionComments={};
  lotoConfirmed=false;
  lotoTimestamp=null;
  currentChecklist=RIDE_CHECKLISTS[currentAssignment.type];
  if(!currentChecklist){toast('Unknown ride type: '+currentAssignment.type,'err');return;}
  var cl=currentChecklist;
  var container=document.getElementById('checklist-container');
  var totalItems=0;
  cl.sections.forEach(function(s){totalItems+=s.items.length;});

  // Header
  var html='<div class="panel"><div class="panel-hdr"><div>';
  html+='<div class="panel-title" style="font-size:16px;">'+cl.title+'</div>';
  html+='<div class="panel-sub" style="margin-top:3px;">'+currentAssignment.facility+' &#x2022; '+currentAssignment.ride+'</div>';
  html+='<div style="font-family:var(--mono);font-size:9px;color:var(--text-muted);margin-top:2px;">'+currentInspector.name+' &#x2022; '+new Date().toLocaleDateString()+' &#x2022; '+cl.manufacturer+'</div>';
  html+='</div></div><div class="panel-body">';

  // LOTO gate
  html+='<div class="loto-gate" id="loto-gate"><div class="loto-icon">&#x1F512;</div><div class="loto-text">Confirm: Main power source has been locked out and tagged out.<br>Zero electrical / energy / mechanical status verified.</div><button class="loto-confirm-btn" onclick="confirmLoto()">Confirm LOTO &#x2192;</button></div>';

  // Progress bar + counters
  html+='<div class="form-progress"><div class="form-progress-fill" id="progress-bar" style="width:0%"></div></div>';
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">';
  html+='<div id="progress-text" style="font-family:var(--mono);font-size:10px;color:var(--text-dim);">0 / '+totalItems+' answered</div>';
  html+='<div id="flagged-counter" style="display:none;font-family:var(--mono);font-size:10px;font-weight:700;color:var(--red);">Flagged: 0 items</div>';
  html+='</div>';

  // Rating key
  html+='<div style="font-family:var(--mono);font-size:8px;color:var(--text-dim);margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;">Rating: <span style="color:var(--red)">1=Hazard</span> <span style="color:#E8636F">2=Deficiency</span> <span style="color:var(--amber)">3=Attention</span> <span style="color:#5CB89A">4=Acceptable</span> <span style="color:var(--green)">5=Excellent</span></div>';

  // Sections
  cl.sections.forEach(function(sec,si){
    html+='<div class="checklist-group">';
    // Section header
    html+='<div class="cg-title" style="font-size:10px;padding-bottom:8px;border-bottom:2px solid var(--accent);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;"><span>'+sec.num+' &#x2022; '+sec.name.toUpperCase()+' &#x2014; '+sec.items.length+' ITEM'+(sec.items.length>1?'S':'')+'</span></div>';
    // Items
    sec.items.forEach(function(item,ii){
      var key=si+'_'+ii;
      var letter=item.substring(0,2);
      var text=item.substring(3);
      var opts='';
      for(var r=1;r<=5;r++){opts+='<div class="cg-opt" onclick="markItem(\''+key+'\','+r+',this)" title="'+r+' \u2014 '+RATING_LABELS[r]+'">'+r+'</div>';}
      html+='<div class="cg-row disabled" id="row-'+key+'">';
      html+='<div style="font-family:var(--mono);font-size:12px;font-weight:700;color:var(--accent);flex-shrink:0;width:22px;">'+letter+'</div>';
      html+='<div class="cg-label">'+text+'</div>';
      html+='<div class="cg-options">'+opts+'</div>';
      html+='</div>';
    });
    // Section comments
    html+='<div style="margin-top:6px;"><textarea id="sec-comment-'+si+'" placeholder="Section comments (optional)" style="width:100%;padding:8px 10px;background:var(--panel2);border:1px solid var(--border2);border-radius:6px;font-family:var(--mono);font-size:11px;color:var(--text);resize:vertical;min-height:36px;outline:none;" oninput="sectionComments['+si+']=this.value"></textarea></div>';
    html+='</div>';
  });

  // Fail summary
  html+='<div id="fail-summary" style="display:none;background:var(--red-dim);border:1px solid rgba(244,63,94,.3);border-radius:7px;padding:10px 12px;margin-bottom:12px;"><div style="font-family:var(--mono);font-size:9px;color:var(--red);margin-bottom:4px;">ITEMS RATED 1-2 &#x2014; CARs will be auto-generated</div><div id="fail-list" style="font-size:11px;color:var(--text);"></div></div>';

  // Notes + submit
  html+='<div class="ff"><label>Notes (optional)</label><input type="text" id="form-notes" placeholder="Overall observations..."></div>';
  html+='<button class="btn btn-accent" id="submit-btn" onclick="submitInspection()" disabled style="opacity:.4;">Submit Inspection &#x2192;</button>';
  html+='<button class="btn btn-ghost" onclick="showScreen(\'assignments\')" style="margin-top:8px;">Cancel</button>';
  html+='</div></div>';

  container.innerHTML=html;
  showScreen('checklist');
}

// ── MARK ITEM ──
function markItem(key,val,el){
  if(!lotoConfirmed)return;
  answers[key]=val;
  var row=document.getElementById('row-'+key);
  if(row){row.querySelectorAll('.cg-opt').forEach(function(o){o.className='cg-opt';});el.classList.add('sel-'+val);}
  updateProgress();
}

function updateProgress(){
  if(!currentChecklist)return;
  var cl=currentChecklist;
  var total=0,answered=0,fails=[];
  cl.sections.forEach(function(sec,si){sec.items.forEach(function(item,ii){total++;var key=si+'_'+ii;var v=answers[key];if(v){answered++;if(v<=2)fails.push({item:item,rating:v});}});});
  var pct=total>0?Math.round(answered/total*100):0;
  var bar=document.getElementById('progress-bar');if(bar)bar.style.width=pct+'%';
  var txt=document.getElementById('progress-text');if(txt)txt.textContent=answered+' / '+total+' answered \u00b7 '+pct+'%';
  // Flagged counter
  var fc=document.getElementById('flagged-counter');
  if(fc){if(fails.length>0){fc.style.display='block';fc.textContent='Flagged: '+fails.length+' item'+(fails.length>1?'s':'');}else{fc.style.display='none';}}
  // Fail summary
  var fs=document.getElementById('fail-summary');var fl=document.getElementById('fail-list');
  if(fs&&fl){if(fails.length){fs.style.display='block';fl.innerHTML=fails.map(function(f){return '<div style="padding:2px 0;">&#x2022; '+f.item+' <span style="font-family:var(--mono);font-size:9px;color:var(--red);">['+f.rating+']</span></div>';}).join('');}else{fs.style.display='none';}}
  // Submit button
  var btn=document.getElementById('submit-btn');
  if(btn){var ready=answered===total&&total>0&&lotoConfirmed;btn.disabled=!ready;btn.style.opacity=ready?'1':'.4';}
}

// ── SUBMIT ──
async function submitInspection(){
  if(!lotoConfirmed){toast('LOTO confirmation required','err');return;}
  if(!currentChecklist)return;
  var cl=currentChecklist;
  var notes=(document.getElementById('form-notes')||{}).value||'';
  var total=0,pass=0,fail=0,watch=0,failItems=[];var scoresObj={};
  cl.sections.forEach(function(sec,si){sec.items.forEach(function(item,ii){total++;var key=si+'_'+ii;var v=answers[key];scoresObj['S'+sec.num+'::'+item]=v;if(v>=4)pass++;else if(v===3)watch++;else if(v<=2){fail++;failItems.push(item);}});});
  if(pass+fail+watch<total){toast('Rate all items','err');return;}
  // Collect section comments
  var allComments=[];
  cl.sections.forEach(function(sec,si){var c=sectionComments[si];if(c&&c.trim())allComments.push('S'+sec.num+': '+c.trim());});
  var combinedNotes=[notes.trim()].concat(allComments).filter(function(n){return n;}).join(' | ');
  var btn=document.getElementById('submit-btn');
  if(btn){btn.disabled=true;btn.textContent='Submitting...';}
  var now=new Date();
  await atPush('Inspector_Log',{
    'Inspector_ID':currentInspector.id,
    'Facility':currentAssignment.facility,
    'Ride':currentAssignment.ride,
    'Inspection_Type':cl.title,
    'Date':now.toISOString().split('T')[0],
    'Scores':JSON.stringify(scoresObj),
    'Failed_Items':failItems.join('; '),
    'Failed_Count':fail,
    'Pass_Count':pass,
    'Watch_Count':watch,
    'Total_Items':total,
    'Avg_Score':total>0?(Object.values(answers).reduce(function(a,b){return a+b;},0)/total).toFixed(1):'0',
    'LOTO_Confirmed':lotoTimestamp,
    'Notes':combinedNotes,
    'Submitted_At':now.toISOString()
  });
  var passRate=total>0?Math.round(pass/total*100):100;
  var flaggedHtml=fail>0?'<br><span style="color:var(--red);font-weight:700;">'+fail+' item'+(fail>1?'s':'')+' flagged for CAR</span>':'';
  document.getElementById('confirm-summary').innerHTML=
    currentAssignment.ride+' &#x2014; '+cl.title+'<br>'+
    currentAssignment.facility+'<br>'+
    currentInspector.name+'<br>'+
    passRate+'% pass &#x2022; '+total+' items'+flaggedHtml+'<br>'+
    '<span style="font-family:var(--mono);font-size:9px;color:var(--text-muted);">'+now.toISOString()+'</span>';
  showScreen('confirm');
  toast('Inspection submitted','ok');
}

// ── AIRTABLE ──
async function atPush(table,fields){
  var el=document.getElementById('at-sync');
  if(el){el.style.color='var(--amber)';el.textContent='\u2B24 SYNCING';}
  try{
    var res=await fetch(AT_URL+'/'+encodeURIComponent(table),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:fields})});
    if(!res.ok){if(el){el.style.color='var(--red)';el.textContent='\u2B24 ERR';setTimeout(function(){if(el){el.style.color='var(--text-muted)';el.textContent='\u2B24 AIRTABLE';}},3000);}}
    else{if(el){el.style.color='var(--green)';el.textContent='\u2B24 SYNCED';setTimeout(function(){if(el){el.style.color='var(--text-muted)';el.textContent='\u2B24 AIRTABLE';}},2000);}}
  }catch(e){if(el){el.style.color='var(--red)';el.textContent='\u2B24 OFFLINE';setTimeout(function(){if(el){el.style.color='var(--text-muted)';el.textContent='\u2B24 AIRTABLE';}},3000);}}
}

function toast(msg,type){
  var el=document.getElementById('toast');
  el.textContent=msg;
  el.className='toast '+(type||'ok')+' show';
  setTimeout(function(){el.classList.remove('show');},3000);
}
</script>
