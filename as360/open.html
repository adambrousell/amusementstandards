<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Opening Inspection · AS 360</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700;800&family=Barlow+Condensed:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0C0F14;--surface:#111520;--panel:#161C27;--panel2:#1C2333;--panel3:#222A3A;
  --border:#242D3E;--border2:#2E3A52;
  --teal:#0ABFBC;--teal-dim:rgba(10,191,188,.15);
  --red:#F43F5E;--red-dim:rgba(244,63,94,.15);
  --amber:#F59E0B;--amber-dim:rgba(245,158,11,.15);
  --green:#10B981;--green-dim:rgba(16,185,129,.15);
  --blue:#3B82F6;--blue-dim:rgba(59,130,246,.15);
  --purple:#8B5CF6;--purple-dim:rgba(139,92,246,.15);
  --text:#CBD5E1;--text-bright:#E8EDF5;--text-dim:#64748B;--text-muted:#3D4F6A;
  --mono:'JetBrains Mono',monospace;--sans:'Barlow',sans-serif;--cond:'Barlow Condensed',sans-serif;
  --accent:#6CA4DC;--accent-dim:rgba(108,164,220,.15);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);}
body{font-family:var(--sans);color:var(--text);display:flex;flex-direction:column;min-height:100vh;min-height:-webkit-fill-available;}

/* ── TOPBAR ─────────────────────────────────────── */
.topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;position:sticky;top:0;z-index:100;}
.tb-logo{display:flex;align-items:center;gap:8px;}
.tb-logo-mark{width:28px;height:28px;background:linear-gradient(135deg,var(--accent),#0891B2);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;font-family:var(--cond);}
.tb-brand{font-family:var(--cond);font-size:15px;font-weight:700;letter-spacing:.5px;color:var(--text-bright);}
.tb-divider{width:1px;height:20px;background:var(--border2);}
.tb-sub{font-family:var(--mono);font-size:10px;color:var(--accent);letter-spacing:1px;}
#at-sync{font-family:var(--mono);font-size:9px;color:var(--text-muted);letter-spacing:.5px;}

/* ── MAIN ───────────────────────────────────────── */
.main{flex:1;overflow-y:auto;padding:14px;max-width:600px;margin:0 auto;width:100%;}
.sec-label{font-family:var(--mono);font-size:9px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-dim);margin-bottom:10px;margin-top:4px;}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow:hidden;margin-bottom:14px;}
.panel-hdr{padding:11px 14px;background:var(--panel2);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.panel-title{font-family:var(--cond);font-size:14px;font-weight:700;color:var(--text-bright);}
.panel-sub{font-size:11px;color:var(--text-dim);margin-top:2px;}
.panel-body{padding:14px;}

/* ── BUTTONS ────────────────────────────────────── */
.btn{padding:11px 18px;border:none;border-radius:8px;font-family:var(--cond);font-size:14px;font-weight:700;cursor:pointer;letter-spacing:.3px;transition:all .15s;min-height:44px;width:100%;text-align:center;}
.btn-accent{background:linear-gradient(135deg,var(--accent),#4A8BC4);color:#fff;}
.btn-teal{background:linear-gradient(135deg,var(--teal),#0891B2);color:#fff;}
.btn-green{background:linear-gradient(135deg,var(--green),#059669);color:#fff;}
.btn-amber{background:linear-gradient(135deg,var(--amber),#D97706);color:#fff;}
.btn-red{background:linear-gradient(135deg,var(--red),#DC2626);color:#fff;}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--text-dim);}
.btn-ghost:hover{border-color:var(--text-dim);color:var(--text);}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5);}

/* ── ROLE SELECT ────────────────────────────────── */
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;}
.role-btn{background:var(--panel2);border:2px solid var(--border2);border-radius:12px;padding:24px 16px;text-align:center;cursor:pointer;transition:all .2s;}
.role-btn:active{transform:scale(.97);}
.role-btn .role-icon{font-size:32px;margin-bottom:8px;}
.role-btn .role-label{font-family:var(--cond);font-size:16px;font-weight:700;color:var(--text-bright);}
.role-btn .role-desc{font-family:var(--mono);font-size:9px;color:var(--text-dim);margin-top:4px;letter-spacing:.5px;}
.role-btn.maintenance:hover,.role-btn.maintenance.sel{border-color:var(--amber);background:var(--amber-dim);}
.role-btn.operations:hover,.role-btn.operations.sel{border-color:var(--teal);background:var(--teal-dim);}

/* ── PIN PAD ────────────────────────────────────── */
.pin-display{display:flex;gap:10px;justify-content:center;margin-bottom:16px;}
.pin-dot{width:18px;height:18px;border-radius:50%;border:2px solid var(--border2);transition:all .15s;}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);}
.pin-dot.error{background:var(--red);border-color:var(--red);animation:shake .4s;}
.pin-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:260px;margin:0 auto;}
.pin-key{background:var(--panel3);border:1px solid var(--border2);border-radius:10px;font-family:var(--cond);font-size:22px;font-weight:700;color:var(--text-bright);height:56px;cursor:pointer;transition:all .1s;display:flex;align-items:center;justify-content:center;}
.pin-key:active{background:var(--accent-dim);border-color:var(--accent);}
.pin-key.del{font-size:14px;color:var(--text-dim);}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* ── FORM / CHECKLIST ───────────────────────────── */
.ff{margin-bottom:10px;}
.ff label{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);display:block;margin-bottom:5px;}
.ff input,.ff select,.ff textarea{width:100%;padding:10px 12px;background:var(--panel2);border:1px solid var(--border2);border-radius:7px;font-family:var(--sans);font-size:14px;color:var(--text);-webkit-appearance:none;transition:border-color .15s;min-height:44px;}
.ff input:focus,.ff select:focus,.ff textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-dim);}
.form-progress{height:3px;background:var(--border);margin-bottom:14px;border-radius:2px;overflow:hidden;}
.form-progress-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .3s;}
.checklist-group{margin-bottom:14px;}
.cg-title{font-family:var(--mono);font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--text-dim);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--border);}
.cg-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(36,45,62,.4);}
.cg-row:last-child{border-bottom:none;}
.cg-label{flex:1;font-size:13px;color:var(--text);font-weight:500;}
.cg-options{display:flex;gap:6px;flex-shrink:0;}
.cg-opt{padding:6px 10px;border-radius:5px;font-family:var(--mono);font-size:9px;font-weight:700;cursor:pointer;border:1px solid var(--border2);color:var(--text-dim);background:var(--panel3);transition:all .12s;min-width:44px;min-height:36px;display:flex;align-items:center;justify-content:center;}
.cg-opt.sel-pass{background:var(--green-dim);border-color:rgba(16,185,129,.4);color:var(--green);}
.cg-opt.sel-flag{background:var(--amber-dim);border-color:rgba(245,158,11,.4);color:var(--amber);}
.cg-opt.sel-fail{background:var(--red-dim);border-color:rgba(244,63,94,.4);color:var(--red);}
.cg-opt.sel-na{background:var(--panel3);border-color:var(--border2);color:var(--text-dim);}

/* ── TOAST ──────────────────────────────────────── */
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:8px;font-family:var(--mono);font-size:11px;font-weight:600;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90vw;text-align:center;}
.toast.ok{background:var(--green-dim);color:var(--green);border:1px solid rgba(16,185,129,.3);}
.toast.err{background:var(--red-dim);color:var(--red);border:1px solid rgba(244,63,94,.3);}
.toast.warn{background:var(--amber-dim);color:var(--amber);border:1px solid rgba(245,158,11,.3);}
.toast.show{opacity:1;}

/* ── BLOCKER BANNER ─────────────────────────────── */
.blocker{background:var(--red-dim);border:1px solid rgba(244,63,94,.3);border-radius:8px;padding:14px;margin-bottom:14px;text-align:center;}
.blocker .blocker-title{font-family:var(--cond);font-size:14px;font-weight:700;color:var(--red);margin-bottom:4px;}
.blocker .blocker-msg{font-size:12px;color:var(--text-dim);}

/* ── CERT BLOCK ─────────────────────────────────── */
.cert-block{background:var(--panel3);border:1px solid var(--border2);border-radius:8px;padding:12px;margin-bottom:14px;font-size:11px;line-height:1.6;color:var(--text-dim);}
.cert-block strong{color:var(--text);}

/* ── FAIL SUMMARY ───────────────────────────────── */
.fail-summary{background:var(--red-dim);border:1px solid rgba(244,63,94,.3);border-radius:7px;padding:10px 12px;margin-bottom:12px;display:none;}
.fail-summary .fs-title{font-family:var(--mono);font-size:9px;color:var(--red);margin-bottom:4px;}
.fail-summary .fs-list{font-size:11px;color:var(--text);}

/* ── MAINT BADGE ────────────────────────────────── */
.maint-ok{background:var(--green-dim);border:1px solid rgba(16,185,129,.3);border-radius:8px;padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;gap:8px;}
.maint-ok .maint-icon{font-size:18px;}
.maint-ok .maint-text{font-family:var(--mono);font-size:10px;color:var(--green);}

.screen{display:none;}
.screen.active{display:block;}
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="tb-logo">
    <div class="tb-logo-mark">AS</div>
    <span class="tb-brand">AS 360</span>
    <div class="tb-divider"></div>
    <span class="tb-sub">OPENING INSPECTION</span>
  </div>
  <div id="at-sync">&#x2B24; AIRTABLE</div>
</div>

<!-- MAIN -->
<div class="main">
  <!-- SCREEN 1: Role Select -->
  <div class="screen active" id="screen-role">
    <div class="panel">
      <div class="panel-hdr">
        <div>
          <div class="panel-title" id="ride-title">Loading...</div>
          <div class="panel-sub" id="ride-sub"></div>
        </div>
      </div>
      <div class="panel-body">
        <div class="sec-label">SELECT YOUR ROLE</div>
        <div class="role-grid">
          <div class="role-btn maintenance" onclick="selectRole('maintenance')">
            <div class="role-icon">&#x1F527;</div>
            <div class="role-label">Maintenance</div>
            <div class="role-desc">ASTM F24 DAILY</div>
          </div>
          <div class="role-btn operations" onclick="selectRole('operations')">
            <div class="role-icon">&#x1F3AF;</div>
            <div class="role-label">Operations</div>
            <div class="role-desc">SUPERVISOR OPEN</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCREEN 2: PIN Entry -->
  <div class="screen" id="screen-pin">
    <div class="panel">
      <div class="panel-hdr">
        <div>
          <div class="panel-title" id="pin-title">Enter PIN</div>
          <div class="panel-sub" id="pin-sub">4-digit staff PIN</div>
        </div>
        <button class="pin-key del" style="width:auto;height:auto;padding:6px 12px;font-size:11px;" onclick="goBack()">&#x2190; Back</button>
      </div>
      <div class="panel-body" style="text-align:center;">
        <div class="pin-display">
          <div class="pin-dot" id="pd0"></div>
          <div class="pin-dot" id="pd1"></div>
          <div class="pin-dot" id="pd2"></div>
          <div class="pin-dot" id="pd3"></div>
        </div>
        <div id="pin-error" style="font-family:var(--mono);font-size:10px;color:var(--red);margin-bottom:12px;min-height:16px;"></div>
        <div class="pin-grid">
          <div class="pin-key" onclick="pinKey('1')">1</div>
          <div class="pin-key" onclick="pinKey('2')">2</div>
          <div class="pin-key" onclick="pinKey('3')">3</div>
          <div class="pin-key" onclick="pinKey('4')">4</div>
          <div class="pin-key" onclick="pinKey('5')">5</div>
          <div class="pin-key" onclick="pinKey('6')">6</div>
          <div class="pin-key" onclick="pinKey('7')">7</div>
          <div class="pin-key" onclick="pinKey('8')">8</div>
          <div class="pin-key" onclick="pinKey('9')">9</div>
          <div class="pin-key" style="visibility:hidden;"></div>
          <div class="pin-key" onclick="pinKey('0')">0</div>
          <div class="pin-key del" onclick="pinDel()">&#x232B;</div>
        </div>
      </div>
    </div>
  </div>

  <!-- SCREEN 3: Checklist -->
  <div class="screen" id="screen-checklist">
    <div id="checklist-container"></div>
  </div>

  <!-- SCREEN 4: Done -->
  <div class="screen" id="screen-done">
    <div class="panel" style="text-align:center;">
      <div class="panel-body" style="padding:32px 16px;">
        <div style="font-size:48px;margin-bottom:12px;">&#x2705;</div>
        <div class="panel-title" style="margin-bottom:6px;">Inspection Submitted</div>
        <div class="panel-sub" id="done-summary"></div>
        <div style="margin-top:20px;">
          <button class="btn btn-ghost" onclick="location.reload()">New Inspection</button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>

// ── STATE ─────────────────────────────────────────────────────────────────────
let currentRide = null;
let currentRole = null;
let currentUser = null;
let pin = '';
let answers = {};
let gpsCoords = null;

// ── INIT ──────────────────────────────────────────────────────────────────────
(function init() {
  const params = new URLSearchParams(window.location.search);
  const rideCode = (params.get('ride') || '').toUpperCase();
  currentRide = RIDES[rideCode];
  if (!currentRide) {
    document.getElementById('ride-title').textContent = 'Unknown Ride';
    document.getElementById('ride-sub').textContent = 'Use ?ride=GKI or ?ride=CCI';
    document.querySelector('.role-grid').innerHTML = '<div style="grid-column:1/-1;text-align:center;color:var(--red);font-family:var(--mono);font-size:11px;">Invalid ride parameter in URL</div>';
    return;
  }
  document.getElementById('ride-title').textContent = currentRide.name;
  document.getElementById('ride-sub').textContent = currentRide.code + ' — Daily Opening Inspection';
  document.title = currentRide.code + ' Opening · AS 360';

  // Request GPS — use watchPosition so coords stay fresh for geofence check at submit
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(
      pos => { gpsCoords = { lat: pos.coords.latitude, lng: pos.coords.longitude, acc: pos.coords.accuracy }; },
      () => { gpsCoords = null; },
      { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 }
    );
  }
})();

// ── NAVIGATION ────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function goBack() {
  pin = '';
  updatePinDots();
  document.getElementById('pin-error').textContent = '';
  showScreen('role');
}

// ── ROLE SELECT ───────────────────────────────────────────────────────────────
function selectRole(role) {
  if (!currentRide) return;
  currentRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('sel'));
  document.querySelector('.role-btn.' + role).classList.add('sel');
  pin = '';
  updatePinDots();
  document.getElementById('pin-error').textContent = '';
  const label = role === 'maintenance' ? 'Maintenance' : 'Operations';

// ── PIN ENTRY ─────────────────────────────────────────────────────────────────
function pinKey(d) {
  if (pin.length >= 4) return;
  pin += d;
  updatePinDots();
  if (pin.length === 4) validatePin();
}

function pinDel() {
  pin = pin.slice(0, -1);
  updatePinDots();
  document.getElementById('pin-error').textContent = '';
}

function updatePinDots() {
  for (let i = 0; i < 4; i++) {
    const dot = document.getElementById('pd' + i);
    dot.className = 'pin-dot' + (i < pin.length ? ' filled' : '');
  }
}

async function validatePin() {
  document.getElementById('pin-error').textContent = '';
  const dots = document.querySelectorAll('.pin-dot');

  try {
    // Query Staff_Directory for PIN match
    const filterFormula = encodeURIComponent(`AND({PIN}='${pin}',FIND('${currentRole}',LOWER({Roles}))>0)`);
    const res = await fetch(`${AT_URL}/Staff_Directory?filterByFormula=${filterFormula}`, {
      method: 'GET',
      headers: { 'Content-Type': 'application/json' }
    });

    if (!res.ok) throw new Error('Network error');
    const data = await res.json();

    if (data.records && data.records.length > 0) {
      const record = data.records[0];
      currentUser = {
        name: record.fields['Name'] || record.fields['Full Name'] || 'Staff',
        id: record.id,
        pin: pin
      };
      dots.forEach(d => { d.className = 'pin-dot filled'; d.style.borderColor = 'var(--green)'; d.style.background = 'var(--green)'; });
      toast('Welcome, ' + currentUser.name, 'ok');
      setTimeout(() => loadChecklist(), 400);
    } else {
      // Invalid PIN
      dots.forEach(d => d.classList.add('error'));
      document.getElementById('pin-error').textContent = 'Invalid PIN or unauthorized role';
      setTimeout(() => { pin = ''; updatePinDots(); }, 800);
    }
  } catch (e) {
    dots.forEach(d => d.classList.add('error'));
    document.getElementById('pin-error').textContent = 'Connection error — retry';
    setTimeout(() => { pin = ''; updatePinDots(); }, 800);
  }
}

// ── CHECK MAINTENANCE SIGN-OFF ────────────────────────────────────────────────
async function checkMaintenanceSignoff() {
  try {
    const today = new Date().toISOString().split('T')[0];
    const filterFormula = encodeURIComponent(`AND({Date}='${today}',{Role}='maintenance')`);
    const res = await fetch(`${AT_URL}/${encodeURIComponent(currentRide.logTable)}?filterByFormula=${filterFormula}`, {
      method: 'GET',
      headers: { 'Content-Type': 'application/json' }
    });
    if (!res.ok) return false;
    const data = await res.json();
    return data.records && data.records.length > 0;
  } catch (e) {
    return false;
  }
}

// ── MARK ITEM ─────────────────────────────────────────────────────────────────
function mark(key, val, el) {
  answers[key] = val;
  const row = document.getElementById('row-' + key);
  if (row) {
    row.querySelectorAll('.cg-opt').forEach(o => o.className = 'cg-opt');
    el.classList.add('sel-' + val);
  }
  updateProgress();
}

function updateProgress() {
  const def = currentRide[currentRole];
  let total = 0, answered = 0, fails = [];
  def.sections.forEach((sec, si) => {
    sec.items.forEach((item, ii) => {
      total++;
      const key = si + '_' + ii;
      if (answers[key]) {
        answered++;
        if (answers[key] === 'fail') fails.push(item);
      }
    });
  });
  const pct = total > 0 ? Math.round(answered / total * 100) : 0;
  const bar = document.getElementById('progress-bar');
  if (bar) bar.style.width = pct + '%';
  const txt = document.getElementById('progress-text');
  if (txt) txt.textContent = answered + ' / ' + total + ' answered · ' + pct + '%';

  // Fail summary
  const fs = document.getElementById('fail-summary');
  const fl = document.getElementById('fail-list');
  if (fs && fl) {
    if (fails.length) {
      fs.style.display = 'block';
      fl.innerHTML = fails.map(f => '<div style="padding:2px 0;">&#x2022; ' + f + '</div>').join('');
    } else {
      fs.style.display = 'none';
    }
  }

  // Enable submit when all answered
  const btn = document.getElementById('submit-btn');
  if (btn) btn.disabled = !(answered === total && total > 0);
}

// ── GEOFENCE ──────────────────────────────────────────────────────────────────
function haversineMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000; // earth radius in meters
  const toRad = d => d * Math.PI / 180;
  const dLat = toRad(lat2 - lat1);
  const dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function checkGeofence() {
  if (!gpsCoords) return { ok: false, reason: 'no-gps', dist: null };
  const dist = haversineMeters(gpsCoords.lat, gpsCoords.lng, GEOFENCE.lat, GEOFENCE.lng);
  if (dist > GEOFENCE.radiusMeters) return { ok: false, reason: 'outside', dist: Math.round(dist) };
  return { ok: true, reason: null, dist: Math.round(dist) };
}
